<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NY Cricket Live – Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp">
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
<style>
  :root {
    --orange: #f07020;
    --orange-glow: rgba(240,112,32,0.4);
    --dark: #0a0a0a;
    --card: #111111;
    --border: rgba(240,112,32,0.18);
    --text-dim: rgba(255,255,255,0.55);
  }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#000; height:100%; font-family:'Rajdhani',sans-serif; color:#fff; overflow-x:hidden; }

  /* ── Header ── */
  header {
    position:fixed; top:0; left:0; right:0; z-index:200;
    background:rgba(10,10,10,0.94); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    height:56px; padding:0 16px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo-wrap { display:flex; align-items:center; gap:10px; text-decoration:none; color:#fff; }
  .logo-wrap img { height:36px; width:36px; object-fit:contain; filter:drop-shadow(0 0 8px var(--orange-glow)); }
  .logo-text { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; }
  .logo-text span { color:var(--orange); }
  .back-btn {
    display:flex; align-items:center; gap:6px;
    text-decoration:none; color:var(--text-dim);
    font-size:13px; font-weight:600; letter-spacing:1px;
    padding:6px 12px; border:1px solid rgba(255,255,255,0.1); border-radius:5px;
    transition: all 0.2s;
  }
  .back-btn:hover { color:#fff; border-color:var(--orange); }
  .live-badge {
    background:var(--orange); color:#fff;
    font-size:10px; font-weight:700; padding:2px 7px; border-radius:2px;
    letter-spacing:1.5px; animation:pulseBadge 2s infinite;
  }
  @keyframes pulseBadge { 0%,100%{opacity:1}50%{opacity:0.65} }

  /* ── Main layout ── */
  main { padding-top:56px; min-height:100vh; background:var(--dark); }

  /* ── Player wrapper ── */
  .player-section {
    background:#000;
    max-width:900px; margin:0 auto;
    position:relative;
  }
  .player-outer {
    position:relative; width:100%; padding-top:56.25%;
    background:#000;
  }
  .shaka-video-container {
    position:absolute; inset:0; width:100%; height:100%;
  }
  video { width:100%; height:100%; background:#000; object-fit:contain; }

  /* ── Shaka YouTube-style theme ── */
  .youtube-theme .shaka-bottom-controls { width:100%; padding:0; z-index:1; display:flex; flex-direction:column; }
  .youtube-theme .shaka-controls-button-panel { height:40px; padding:0 10px; }
  .youtube-theme .shaka-range-container { margin:4px 10px; top:0; }
  .youtube-theme .shaka-small-play-button { order:-3; }
  .youtube-theme .shaka-mute-button { order:-2; }
  .youtube-theme .shaka-controls-button-panel > * { margin:0; padding:3px 8px; color:#EEE; height:40px; }
  .youtube-theme .shaka-controls-button-panel > *:hover { color:#FFF; }
  .youtube-theme .shaka-controls-button-panel .shaka-volume-bar-container { position:relative; z-index:10; left:-1px; order:-1; opacity:0; width:0; transition:width 0.2s; height:3px; padding:0; }
  .youtube-theme .shaka-controls-button-panel .shaka-volume-bar-container:hover,
  .youtube-theme .shaka-mute-button:hover + div { opacity:1; width:50px; padding:0 6px; }
  .youtube-theme .shaka-current-time { padding:0 10px; font-size:12px; }
  .youtube-theme .shaka-seek-bar-container { height:3px; border-radius:0; margin-bottom:0; }
  .youtube-theme .shaka-seek-bar-container .shaka-range-element { opacity:0; }
  .youtube-theme .shaka-seek-bar-container:hover { height:5px; cursor:pointer; }
  .youtube-theme .shaka-seek-bar-container:hover .shaka-range-element { opacity:1; }
  .youtube-theme .shaka-seek-bar-container input[type=range]::-webkit-slider-thumb { background:var(--orange); cursor:pointer; }
  .youtube-theme .shaka-overflow-menu, .youtube-theme .shaka-settings-menu { border-radius:4px; background:rgba(20,20,20,.95); right:10px; bottom:50px; padding:8px 0; min-width:200px; }
  .youtube-theme .shaka-overflow-menu button:hover, .youtube-theme .shaka-settings-menu button:hover { background:rgba(255,255,255,.1); }
  .youtube-theme .shaka-overflow-menu button, .youtube-theme .shaka-settings-menu button { color:#EEE; }
  .youtube-theme .shaka-overflow-menu button i { display:none; }
  .youtube-theme .shaka-overflow-menu button .shaka-overflow-button-label { display:flex; justify-content:space-between; align-items:center; height:40px; flex:0 0 100%; }
  .youtube-theme .shaka-overflow-menu button .shaka-overflow-button-label span { padding-left:15px; font-size:13px; font-weight:500; }
  .youtube-theme .shaka-seek-bar { background:rgba(255,255,255,.2) !important; }
  .youtube-theme .shaka-buffered-range { background:rgba(255,255,255,.4) !important; }
  .youtube-theme .shaka-played-range { background:var(--orange) !important; }
  .shaka-spinner-container, .shaka-spinner, .shaka-spinner-svg { display:none !important; }

  /* ── Play Overlay ── */
  #playOverlay {
    position:absolute; inset:0; z-index:3000;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    cursor:pointer;
    background:linear-gradient(to bottom,rgba(0,0,0,0.3) 0%,rgba(0,0,0,0.65) 100%);
  }
  #playOverlay.fade-out { animation:fadeOut 0.4s ease forwards; pointer-events:none; }
  @keyframes fadeOut { to { opacity:0; visibility:hidden; } }
  .ring { width:50px; height:50px; border:4px solid rgba(240,112,32,0.2); border-top-color:var(--orange); border-radius:50%; animation:spin 0.85s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #playBtn {
    display:none; width:72px; height:72px; border-radius:50%;
    background:rgba(240,112,32,0.9);
    align-items:center; justify-content:center;
    box-shadow:0 0 0 0 rgba(240,112,32,0.45);
    animation:pulse 2.2s infinite; transition:transform 0.15s;
  }
  #playBtn svg { width:30px; height:30px; margin-left:5px; fill:#fff; }
  #playBtn:hover { transform:scale(1.1); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(240,112,32,0.45)}70%{box-shadow:0 0 0 20px rgba(240,112,32,0)}100%{box-shadow:0 0 0 0 rgba(240,112,32,0)} }
  .overlay-label { color:rgba(255,255,255,0.8); font-size:13px; letter-spacing:.08em; text-shadow:0 1px 6px rgba(0,0,0,.9); font-weight:600; }

  /* ── Watermark ── */
  #watermarkLogo {
    position:absolute; left:10px; top:62%; width:52px; height:auto;
    opacity:0.3; z-index:1500; pointer-events:none;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,0.7));
    transition:opacity 0.3s;
  }
  .shaka-video-container:hover #watermarkLogo { opacity:0.5; }

  /* ── Error Box ── */
  #errorBox {
    display:none; position:absolute; inset:0; z-index:5000;
    background:#000; flex-direction:column; align-items:center; justify-content:center;
    color:#f77; font-size:15px; text-align:center; padding:24px; gap:16px;
  }
  #retryBtn { padding:10px 28px; background:var(--orange); color:#fff; border:none; border-radius:6px; font-size:14px; cursor:pointer; font-family:'Rajdhani',sans-serif; font-weight:700; }
  #retryBtn:hover { opacity:0.85; }

  /* ── Channel Info Panel ── */
  .channel-info {
    max-width:900px; margin:0 auto;
    padding:16px 20px;
    display:flex; align-items:center; gap:14px;
    border-bottom:1px solid var(--border);
  }
  .ch-logo { width:52px; height:52px; border-radius:8px; object-fit:contain; background:#1a1a1a; padding:4px; border:1px solid var(--border); }
  .ch-details { flex:1; min-width:0; }
  .ch-name { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:1.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ch-sub { font-size:12px; color:var(--text-dim); font-weight:500; letter-spacing:.5px; display:flex; align-items:center; gap:6px; margin-top:3px; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:var(--orange); animation:pulseDot 1.5s infinite; flex-shrink:0; }
  @keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)} }

  /* ── Related Channels ── */
  .related-section { max-width:900px; margin:0 auto; padding:20px; }
  .section-title {
    font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px;
    color:var(--text-dim); margin-bottom:14px;
    display:flex; align-items:center; gap:10px;
  }
  .section-title::after { content:''; flex:1; height:1px; background:var(--border); }
  .channels-row {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px;
  }
  .mini-card {
    background:var(--card); border:1px solid var(--border); border-radius:8px;
    overflow:hidden; cursor:pointer; text-decoration:none; color:inherit;
    transition:border-color .2s, transform .2s;
  }
  .mini-card:hover { border-color:var(--orange); transform:translateY(-2px); }
  .mini-card.active { border-color:var(--orange); box-shadow:0 0 12px rgba(240,112,32,0.3); }
  .mini-logo { width:100%; height:70px; background:#1a1a1a; display:flex; align-items:center; justify-content:center; padding:8px; }
  .mini-logo img { width:100%; height:100%; object-fit:contain; }
  .mini-name { padding:6px 8px; font-size:10px; font-weight:700; letter-spacing:.3px; text-align:center; line-height:1.3; }

  /* ── Footer ── */
  footer { text-align:center; padding:24px; color:var(--text-dim); font-size:11px; letter-spacing:.5px; border-top:1px solid var(--border); margin-top:10px; }
</style>
</head>
<body>

<header>
  <a class="logo-wrap" href="index.html">
    <img src="https://i.postimg.cc/J4m9Dz70/Gemini-Generated-Image-4zvnud4zvnud4zvn-Picsart-Background-Remover.png" alt="NY Cricket Live">
    <div class="logo-text"><span>NY</span> CRICKET</div>
  </a>
  <div class="live-badge">● LIVE</div>
  <a class="back-btn" href="index.html">← All Channels</a>
</header>

<main>
  <!-- Player -->
  <div class="player-section">
    <div class="player-outer">
      <div class="shaka-video-container youtube-theme" data-shaka-player>
        <video playsinline preload="auto"></video>
        <div id="playOverlay">
          <div class="ring" id="loadRing"></div>
          <div id="playBtn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          <div class="overlay-label" id="overlayLabel">Fetching stream…</div>
        </div>
        <img id="watermarkLogo" src="https://i.postimg.cc/J4m9Dz70/Gemini-Generated-Image-4zvnud4zvnud4zvn-Picsart-Background-Remover.png" alt="">
        <div id="errorBox">
          <span id="errorMsg">⚠ Stream error</span>
          <button id="retryBtn" onclick="retryLoad()">↺ Retry</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Channel Info -->
  <div class="channel-info" id="channelInfo" style="display:none">
    <img class="ch-logo" id="chLogo" src="" alt="">
    <div class="ch-details">
      <div class="ch-name" id="chName">Loading…</div>
      <div class="ch-sub"><div class="live-dot"></div><span>LIVE STREAM · HD</span></div>
    </div>
  </div>

  <!-- Related Channels -->
  <div class="related-section">
    <div class="section-title">MORE CHANNELS</div>
    <div class="channels-row" id="channelsRow"></div>
  </div>
</main>

<footer>© 2025 NY Cricket Live · For educational purposes only</footer>

<script>
const API = 'https://binge-jiotv.pages.dev/data/id.json';

const video       = document.querySelector('video');
const container   = document.querySelector('.shaka-video-container');
const playOverlay = document.getElementById('playOverlay');
const loadRing    = document.getElementById('loadRing');
const playBtn     = document.getElementById('playBtn');
const overlayLabel= document.getElementById('overlayLabel');
const errorBox    = document.getElementById('errorBox');
const errorMsg    = document.getElementById('errorMsg');

let shakaPlayer  = null;
let streamReady  = false;
let retryCount   = 0;
const MAX_RETRIES = 3;
let allChannels   = [];
let currentChannel = null;

// Read ?id= from URL
const urlParams = new URLSearchParams(window.location.search);
const channelId = urlParams.get('id') || '';

const isInIframe = () => { try { return window.self !== window.top; } catch { return true; } };
const showError  = msg => { errorMsg.textContent = '⚠ ' + msg; errorBox.style.display = 'flex'; playOverlay.style.display = 'none'; };
const markReady  = () => { loadRing.style.display='none'; playBtn.style.display='flex'; overlayLabel.textContent='Tap to Play'; };
const dismissOverlay = () => playOverlay.classList.add('fade-out');

const doPlay = async () => {
  if (!streamReady) return;
  try { video.muted=false; video.volume=0.8; await video.play(); dismissOverlay(); }
  catch { try { video.muted=true; await video.play(); dismissOverlay(); } catch { overlayLabel.textContent='Tap again to play'; } }
};

playOverlay.addEventListener('click', doPlay);
playOverlay.addEventListener('touchend', e => { e.preventDefault(); doPlay(); });

video.addEventListener('play', () => {
  if (!isInIframe() && !document.fullscreenElement && window.innerWidth <= 768)
    container.requestFullscreen().catch(()=>{});
}, { once:true });

let soundUnlocked = false;
['click','touchstart','keydown'].forEach(ev =>
  document.addEventListener(ev, () => { if (!soundUnlocked && video.muted) { video.muted=false; soundUnlocked=true; } }, { once:true })
);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && video.paused && streamReady) video.play().catch(()=>{});
});

function retryLoad() {
  if (!shakaPlayer || !currentChannel) return;
  errorBox.style.display='none';
  playOverlay.style.display='flex'; playOverlay.classList.remove('fade-out');
  loadRing.style.display=''; playBtn.style.display='none';
  overlayLabel.textContent='Reconnecting…';
  streamReady=false; retryCount=0;
  initStream(shakaPlayer, currentChannel);
}

async function setupPlayer(ch) {
  currentChannel = ch;
  document.title = ch.name + ' – NY Cricket Live';

  // Update channel info
  document.getElementById('chName').textContent = ch.name;
  document.getElementById('chLogo').src = ch.logo || '';
  document.getElementById('channelInfo').style.display = 'flex';

  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) { showError('Browser not supported'); return; }

  overlayLabel.textContent = 'Setting up player…';

  const player = new shaka.Player(video);
  shakaPlayer = player;

  const ui = new shaka.ui.Overlay(player, container, video);
  ui.configure({ controlPanelElements: ['play_pause','time_and_duration','mute','volume','spacer','captions','quality','language','picture_in_picture','fullscreen','overflow_menu'] });

  if (ch.keyId && ch.key) {
    player.configure({ drm: { clearKeys: { [ch.keyId]: ch.key } } });
  }

  player.getNetworkingEngine().registerRequestFilter((type, request) => {
    request.headers['Referer']    = 'https://www.jiotv.com/';
    request.headers['Origin']     = 'https://www.jiotv.com';
    request.headers['User-Agent'] = 'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';
    if (ch.cookie) {
      request.headers['Cookie'] = ch.cookie;
      if ((type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
           type === shaka.net.NetworkingEngine.RequestType.SEGMENT) &&
          !request.uris[0].includes('__hdnea__='))
        request.uris[0] += (request.uris[0].includes('?') ? '&' : '?') + ch.cookie;
    }
  });

  player.getNetworkingEngine().registerResponseFilter((type, response) => {
    if (response.status === 429) {
      const wait = parseInt(response.headers['retry-after'] || '6', 10) * 1000;
      return new Promise(res => setTimeout(res, wait));
    }
  });

  player.configure({
    streaming: {
      lowLatencyMode: false, bufferingGoal: 10, rebufferingGoal: 3, bufferBehind: 10,
      segmentPrefetchLimit: 1, useNativeHlsOnSafari: true,
      retryParameters: { timeout:15000, maxAttempts:2, baseDelay:3000, backoffFactor:2.0, fuzzFactor:0.5 }
    },
    manifest: {
      retryParameters: { timeout:10000, maxAttempts:2, baseDelay:3000, backoffFactor:2.0 },
      dash: { ignoreMinBufferTime:true, autoCorrectDrift:true }
    }
  });

  player.addEventListener('error', e => {
    const err = e.detail;
    if (err.severity === 1) return;
    if (retryCount < MAX_RETRIES) {
      retryCount++;
      overlayLabel.textContent = `Retrying… (${retryCount}/${MAX_RETRIES})`;
      errorBox.style.display='none'; playOverlay.style.display='flex'; playOverlay.classList.remove('fade-out');
      setTimeout(() => initStream(player, ch), retryCount * 5000);
    } else {
      showError('Stream stopped. May be expired. Tap Retry.');
    }
  });

  await initStream(player, ch);
}

async function initStream(player, ch) {
  try {
    await player.load(ch.url);
    streamReady=true; retryCount=0;
    try { video.muted=true; await video.play(); dismissOverlay(); }
    catch { markReady(); }
  } catch(err) {
    if (retryCount < MAX_RETRIES) {
      retryCount++;
      overlayLabel.textContent = `Connecting… (${retryCount}/${MAX_RETRIES})`;
      setTimeout(() => initStream(player, ch), retryCount * 5000);
    } else {
      showError('Cannot load stream. Link may be expired.');
    }
  }
}

function renderRelated(channels, activeId) {
  const row = document.getElementById('channelsRow');
  row.innerHTML = '';
  channels.forEach(ch => {
    const card = document.createElement('a');
    card.className = 'mini-card' + (ch.id === activeId ? ' active' : '');
    card.href = `player.html?id=${encodeURIComponent(ch.id)}`;
    card.innerHTML = `
      <div class="mini-logo"><img src="${ch.logo||''}" alt="${ch.name}" onerror="this.src='https://i.postimg.cc/J4m9Dz70/Gemini-Generated-Image-4zvnud4zvnud4zvn-Picsart-Background-Remover.png'"></div>
      <div class="mini-name">${ch.name}</div>
    `;
    row.appendChild(card);
  });
}

// Main init
(async () => {
  try {
    const res = await fetch(API);
    const data = await res.json();
    allChannels = Array.isArray(data) ? data : (data.channels || data.data || []);
  } catch(e) {
    showError('Failed to load channel list'); return;
  }

  renderRelated(allChannels, channelId);

  const ch = channelId ? allChannels.find(c => c.id === channelId) : allChannels[0];
  if (!ch) { showError('Channel not found'); return; }

  document.addEventListener('DOMContentLoaded', () => {}, { once:true });
  await setupPlayer(ch);
})();
</script>
</body>
</html>
