<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NY Cricket Live</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.compiled.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:Inter,sans-serif;
color:#fff;
overflow-x:hidden;
}

/* top bar */

header{
height:56px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 18px;
background:#070707;
border-bottom:1px solid rgba(255,255,255,.08);
position:fixed;
left:0;
right:0;
top:0;
z-index:9999;
}

.logo{
font-size:20px;
font-weight:800;
letter-spacing:1px;
}

.livepill{
background:#e50914;
padding:5px 12px;
border-radius:30px;
font-size:11px;
font-weight:800;
}

main{
padding-top:56px;
}

/* player */

.player-wrap{
width:100%;
background:#000;
}

.player{
position:relative;
width:100%;
padding-top:56.25%;
background:#000;
overflow:hidden;
}

video{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:contain;
background:#000;
}

/* watermark */

.wm{
position:absolute;
left:18px;
top:58%;
width:42px;
opacity:.22;
z-index:4;
}

/* loading */

#loader{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:18px;
background:#000;
z-index:30;
}

.spin{
width:58px;
height:58px;
border-radius:50%;
border:4px solid rgba(255,255,255,.15);
border-top-color:#1e88ff;
animation:spin .8s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg)
}
}

/* custom controls */

.controls{
position:absolute;
left:0;
right:0;
bottom:0;
padding:0 18px 14px;
z-index:50;
opacity:0;
transition:.25s;
}

.player:hover .controls,
.player.show-controls .controls{
opacity:1;
}

/* transparent fade only */
.controls::before{
content:'';
position:absolute;
left:0;
right:0;
bottom:0;
height:110px;
background:linear-gradient(to top,rgba(0,0,0,.58),transparent);
pointer-events:none;
z-index:-1;
}

/* live dvr bar */

.timeline-wrap{
margin-bottom:12px;
}

.live-row{
display:flex;
align-items:center;
gap:10px;
margin-bottom:8px;
font-size:11px;
font-weight:700;
}

.dot{
width:8px;
height:8px;
border-radius:50%;
background:red;
animation:pulse 1.2s infinite;
}

@keyframes pulse{
50%{
transform:scale(1.4);
opacity:.45;
}
}

#goLive{
border:0;
background:#e50914;
color:#fff;
padding:4px 10px;
font-size:10px;
font-weight:800;
border-radius:16px;
display:none;
cursor:pointer;
}

.timeline{
height:5px;
background:rgba(255,255,255,.22);
border-radius:20px;
overflow:hidden;
position:relative;
cursor:pointer;
}

.buffer{
position:absolute;
height:100%;
background:rgba(255,255,255,.28);
width:0%;
}

.played{
position:absolute;
height:100%;
background:#1e88ff;
width:100%;
right:0;
}

/* bottom buttons */

.control-row{
display:flex;
align-items:center;
justify-content:space-between;
}

.left,
.right{
display:flex;
align-items:center;
gap:14px;
}

.ctrl{
width:34px;
height:34px;
border:0;
background:none;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

.ctrl svg{
fill:#fff;
width:22px;
height:22px;
}

/* volume */
.volbox{
display:flex;
align-items:center;
gap:8px;
}

#volume{
width:70px;
accent-color:#1e88ff;
}

/* channel info */

.info{
padding:16px;
display:flex;
align-items:center;
gap:14px;
border-bottom:1px solid rgba(255,255,255,.07);
}

.info img{
width:54px;
height:54px;
object-fit:contain;
border-radius:10px;
background:#111;
}

.name{
font-size:20px;
font-weight:800;
}

/* cards */

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
gap:10px;
padding:18px;
}

.card{
background:#101010;
border:1px solid rgba(255,255,255,.08);
border-radius:10px;
overflow:hidden;
text-decoration:none;
color:#fff;
}

.card img{
width:100%;
height:70px;
object-fit:contain;
padding:8px;
background:#171717;
}

.card div{
padding:8px;
font-size:11px;
font-weight:700;
text-align:center;
}

@media(max-width:700px){
#volume{
width:55px;
}
.control-row{
gap:8px;
}
}
</style>
</head>
<body>

<header>
<div class="logo">NY CRICKET</div>
<div class="livepill">LIVE</div>
</header>

<main>

<div class="player-wrap">
<div class="player" id="playerWrap">

<video id="video" autoplay muted playsinline></video>

<div id="loader">
<div class="spin"></div>
<div>Connecting Live…</div>
</div>

<img class="wm"
src="https://i.postimg.cc/J4m9Dz70/Gemini-Generated-Image-4zvnud4zvnud4zvn-Picsart-Background-Remover.png">

<!-- CUSTOM HOTSTAR CONTROLS -->
<div class="controls">

<div class="timeline-wrap">

<div class="live-row">
<div class="dot"></div>
LIVE
<button id="goLive">GO LIVE</button>
</div>

<div class="timeline" id="timeline">
<div class="buffer" id="buffer"></div>
<div class="played" id="played"></div>
</div>

</div>

<div class="control-row">

<div class="left">

<button class="ctrl" id="playBtn">
<svg viewBox="0 0 24 24">
<path d="M8 5v14l11-7z"/>
</svg>
</button>

<div class="volbox">
<button class="ctrl" id="muteBtn">
<svg viewBox="0 0 24 24">
<path d="M5 9v6h4l5 5V4L9 9z"/>
</svg>
</button>

<input
type="range"
id="volume"
min="0"
max="1"
step=".05"
value="1">
</div>

</div>

<div class="right">

<button class="ctrl" id="fsBtn">
<svg viewBox="0 0 24 24">
<path d="M7 14H5v5h5v-2H7zm0-4h2V7h3V5H5v5zm10 7h-3v2h5v-5h-2zm0-12V5h-5v2h3v3h2z"/>
</svg>
</button>

</div>

</div>
</div>
</div>
</div>

<div class="info">
<img id="logo">
<div class="name" id="channelName">Loading...</div>
</div>

<div class="grid" id="grid"></div>

</main>

<script>
const API="https://binge-jiotv.pages.dev/data/id.json";

const video=document.getElementById('video');
const goLive=document.getElementById('goLive');
const played=document.getElementById('played');
const buffer=document.getElementById('buffer');
const timeline=document.getElementById('timeline');

let player;
let currentChannel;

const id=
new URLSearchParams(location.search).get('id')||'';

async function getChannels(){
const r=await fetch(API,{cache:"no-store"});
const d=await r.json();
return d.channels||d;
}

function renderCards(list){
document.getElementById('grid').innerHTML=
list.map(c=>`
<a class="card" href="?id=${c.id}">
<img src="${c.logo}">
<div>${c.name}</div>
</a>
`).join('');
}

async function init(ch){

currentChannel=ch;

document.getElementById(
'channelName'
).innerText=ch.name;

document.getElementById(
'logo'
).src=ch.logo;

shaka.polyfill.installAll();

player=new shaka.Player(video);

if(ch.keyId&&ch.key){
player.configure({
drm:{
clearKeys:{
[ch.keyId]:ch.key
}
}
});
}

player.getNetworkingEngine()
.registerRequestFilter(
(type,req)=>{

req.headers.Referer=
"https://www.jiotv.com/";

if(ch.cookie){

req.headers.Cookie=
ch.cookie;

let token=
ch.cookie.replace(
'__hdnea__=',
''
);

if(
(type===0||type===1)
&&
!req.uris[0].includes(
'__hdnea__'
)
){
let sep=
req.uris[0].includes('?')
?'&':'?';

req.uris[0]+=
sep+
'__hdnea__='+
token;
}

}

});

await player.load(ch.url);

await video.play();

document.getElementById(
'loader'
).style.display='none';

startDVR();

}

/* DVR edge logic */
function startDVR(){

setInterval(()=>{

let r=
player.seekRange();

if(!r)return;

let latency=
r.end-video.currentTime;

let total=
r.end-r.start;

let pos=
(video.currentTime-r.start)
/total*100;

played.style.width=
pos+'%';

if(latency>10){
goLive.style.display=
'inline-block';
}else{
goLive.style.display='none';
}

if(video.buffered.length){
let b=
(video.buffered.end(0)-r.start)
/
total*100;
buffer.style.width=b+'%';
}

},1000);

}

goLive.onclick=()=>{
let r=player.seekRange();
player.seek(r.end-1);
};

/* controls */
document.getElementById(
'playBtn'
).onclick=()=>{

if(video.paused){
video.play();
}else{
video.pause();
}

};

document.getElementById(
'muteBtn'
).onclick=()=>{
video.muted=!video.muted;
};

document.getElementById(
'volume'
).oninput=e=>{
video.volume=e.target.value;
};

document.getElementById(
'fsBtn'
).onclick=()=>{
document.documentElement
.requestFullscreen();
};

timeline.onclick=e=>{
let r=player.seekRange();
let pct=
e.offsetX/
timeline.offsetWidth;
player.seek(
r.start+
((r.end-r.start)*pct)
);
};

/* auto hide controls */
let wrap=
document.getElementById(
'playerWrap'
);

let t;
wrap.addEventListener(
'mousemove',
()=>{
wrap.classList.add(
'show-controls'
);
clearTimeout(t);
t=setTimeout(()=>{
wrap.classList.remove(
'show-controls'
);
},3000);
}
);

(async()=>{
let channels=
await getChannels();

renderCards(channels);

let ch=
id
?channels.find(
x=>x.id===id
)
:channels[0];

if(!ch) ch=channels[0];

init(ch);

})();
</script>

</body>
</html>
