<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>NY Cricket Live</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Bebas+Neue&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>

<style>

:root{
--orange:#ff6b00;
--bg:#050505;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#fff;
font-family:Rajdhani,sans-serif;
overflow-x:hidden;
}


/* HEADER */

header{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
background:linear-gradient(to bottom,#000,rgba(0,0,0,.75));
backdrop-filter:blur(12px);
z-index:99999;
}

.logo{
font-family:'Bebas Neue';
font-size:30px;
letter-spacing:2px;
}

.logo span{
color:var(--orange);
}

.liveTop{
background:#e50914;
padding:5px 12px;
font-size:12px;
font-weight:700;
border-radius:30px;
}

.back{
text-decoration:none;
color:white;
border:1px solid #444;
padding:8px 15px;
border-radius:8px;
}


main{
padding-top:60px;
}



/* PLAYER */

.player-wrap{
max-width:1400px;
margin:auto;
background:#000;
}

.player-box{
position:relative;
padding-top:56.25%;
background:#000;
overflow:hidden;
}

.shaka-video-container{
position:absolute;
inset:0;
background:#000;
}

video{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}


/* NETFLIX STYLE SHAKA */

.shaka-controls-container{
z-index:9000!important;
background:linear-gradient(
to top,
rgba(0,0,0,.9),
rgba(0,0,0,.0)
)!important;
}

.shaka-bottom-controls{
padding-bottom:18px!important;
}

.shaka-seek-bar-container{
height:6px!important;
}

.shaka-seek-bar-container:hover{
height:9px!important;
}

.shaka-seek-bar{
background:rgba(255,255,255,.2)!important;
}

.shaka-played-range{
background:#e50914!important;
}

.shaka-buffered-range{
background:#999!important;
}

.shaka-volume-bar-container{
width:90px!important;
}

.shaka-overflow-menu{
background:#111!important;
border-radius:14px!important;
}



/* BUFFER OVERLAY */

#overlay{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
gap:18px;
background:linear-gradient(
to bottom,
rgba(0,0,0,.15),
rgba(0,0,0,.65)
);
z-index:800;
transition:.4s;
}

#overlay.hide{
opacity:0;
visibility:hidden;
pointer-events:none;
}

#spinner{
width:65px;
height:65px;
border-radius:50%;
border:4px solid rgba(255,255,255,.15);
border-top-color:var(--orange);
animation:spin .8s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg)
}
}

#overlayText{
font-size:14px;
font-weight:700;
letter-spacing:1px;
}



/* WATERMARK */

#watermark{
position:absolute;
left:18px;
top:62%;
width:62px;
opacity:.28;
z-index:1000;
pointer-events:none;
}



/* HOTSTAR DVR BAR */

#livePanel{
position:absolute;
right:20px;
bottom:72px;
display:flex;
align-items:center;
gap:14px;
padding:10px 16px;
border-radius:40px;
background:rgba(0,0,0,.72);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.14);
z-index:9500;
font-weight:700;
}

#liveDot{
width:10px;
height:10px;
border-radius:50%;
background:#ff2b2b;
animation:pulse 1.4s infinite;
}

@keyframes pulse{
50%{
transform:scale(1.5);
opacity:.4;
}
}

.behind #liveDot{
background:#888;
animation:none;
}

#goLiveBtn{
display:none;
background:#e50914;
color:white;
border:0;
padding:8px 16px;
border-radius:25px;
cursor:pointer;
font-weight:700;
}



/* CHANNEL INFO */

.info{
max-width:1200px;
margin:auto;
padding:22px;
display:flex;
gap:16px;
align-items:center;
border-bottom:1px solid #222;
background:#080808;
}

.info img{
width:64px;
height:64px;
border-radius:12px;
background:#111;
}

.channel-name{
font-size:30px;
font-family:'Bebas Neue';
letter-spacing:1px;
}



/* CHANNEL GRID */

.related{
max-width:1200px;
margin:auto;
padding:28px;
}

.title{
font-size:28px;
font-family:'Bebas Neue';
margin-bottom:18px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
gap:14px;
}

.card{
text-decoration:none;
color:#fff;
background:#111;
border-radius:12px;
overflow:hidden;
transition:.2s;
border:1px solid #222;
}

.card:hover{
transform:scale(1.03);
}

.card.active{
border:1px solid #e50914;
}

.card-logo{
height:90px;
display:flex;
justify-content:center;
align-items:center;
padding:10px;
}

.card-logo img{
width:100%;
height:100%;
object-fit:contain;
}

.card-name{
padding:10px;
font-size:12px;
text-align:center;
font-weight:700;
}



#errorBox{
display:none;
position:absolute;
inset:0;
background:#000;
z-index:100000;
justify-content:center;
align-items:center;
flex-direction:column;
gap:18px;
}

#errorBox button{
background:#e50914;
border:0;
padding:12px 30px;
color:white;
cursor:pointer;
}

</style>
</head>
<body>


<header>
<div class="logo"><span>NY</span> CRICKET</div>
<div class="liveTop">● LIVE</div>
<a href="index.html" class="back">Channels</a>
</header>


<main>

<div class="player-wrap">
<div class="player-box">

<div class="shaka-video-container">

<video id="video" autoplay muted playsinline></video>

<div id="overlay">
<div id="spinner"></div>
<div id="overlayText">Connecting...</div>
</div>

<img
id="watermark"
src="https://i.postimg.cc/J4m9Dz70/Gemini-Generated-Image-4zvnud4zvnud4zvn-Picsart-Background-Remover.png">


<div id="livePanel">
<div id="liveDot"></div>
<div id="liveLabel">LIVE</div>
<button id="goLiveBtn">
Go Live
</button>
</div>


<div id="errorBox">
<h2>Stream Error</h2>
<button onclick="loadStream()">
Retry
</button>
</div>

</div>
</div>
</div>


<div class="info">
<img id="logo">
<div>
<div class="channel-name" id="channelName">
Loading...
</div>
<div>LIVE HD DVR STREAM</div>
</div>
</div>


<div class="related">
<div class="title">MORE CHANNELS</div>
<div class="grid" id="grid"></div>
</div>

</main>



<script>

const API=
"https://binge-jiotv.pages.dev/data/id.json";

const video=
document.getElementById("video");

const container=
document.querySelector(".shaka-video-container");

let player;
let currentChannel;
let retries=0;

const channelId=
new URLSearchParams(location.search)
.get("id")||"";



function hideOverlay(){
document.getElementById("overlay")
.classList.add("hide");
}


function showError(){
document.getElementById(
"errorBox"
).style.display="flex";
}



async function fetchChannels(){

let r=await fetch(
API,
{cache:"no-store"}
);

let d=await r.json();

return Array.isArray(d.channels)
?d.channels:d;

}



function renderChannels(channels){

let html='';

channels.forEach(c=>{

html+=`
<a class="card ${
c.id===channelId?'active':''
}" href="?id=${c.id}">
<div class="card-logo">
<img src="${c.logo}">
</div>
<div class="card-name">
${c.name}
</div>
</a>
`;

});

document.getElementById(
"grid"
).innerHTML=html;

}



async function initPlayer(ch){

currentChannel=ch;

document.getElementById(
"channelName"
).innerText=ch.name;

document.getElementById(
"logo"
).src=ch.logo;


shaka.polyfill.installAll();

player=
new shaka.Player(video);


new shaka.ui.Overlay(
player,
container,
video
).configure({

controlPanelElements:[
"mute",
"play_pause",
"time_and_duration",
"spacer",
"quality",
"picture_in_picture",
"fullscreen"
]

});


if(ch.keyId&&ch.key){

player.configure({
drm:{
clearKeys:{
[ch.keyId]:ch.key
}
}
});

}


player.getNetworkingEngine()
.registerRequestFilter(
(type,request)=>{

request.headers.Referer=
"https://www.jiotv.com/";

request.headers.Origin=
"https://www.jiotv.com";

if(ch.cookie){

request.headers.Cookie=
ch.cookie;

let token=
ch.cookie.replace(
"__hdnea__=",""
);

if(
(type===1||type===0)&&
!request.uris[0].includes(
"__hdnea__"
)
){

let sep=
request.uris[0]
.includes("?")
?"&":"?";

request.uris[0]+=
sep+
"__hdnea__="+token;

}

}

}
);


player.addEventListener(
'error',
()=>{
if(retries<4){
retries++;
setTimeout(
loadStream,
2000
);
}else{
showError();
}
}
);


await loadStream();

setupLiveDVR();

}



async function loadStream(){

try{

await player.load(
currentChannel.url
);

retries=0;

await video.play();

hideOverlay();

}
catch(e){

console.log(e);

showError();

}

}



function setupLiveDVR(){

setInterval(()=>{

if(!player) return;

let range=
player.seekRange();

if(!range) return;

let liveEdge=
range.end;

let behind=
liveEdge-video.currentTime;

let panel=
document.getElementById(
"livePanel"
);

let btn=
document.getElementById(
"goLiveBtn"
);


if(behind>20){

panel.classList.add(
"behind"
);

btn.style.display=
"inline-block";

}else{

panel.classList.remove(
"behind"
);

btn.style.display=
"none";

}

},1500);



document.getElementById(
"goLiveBtn"
).onclick=()=>{

let r=
player.seekRange();

player.seek(r.end-2);

};

}



(async()=>{

try{

let channels=
await fetchChannels();

renderChannels(
channels
);

let ch=
channelId
?channels.find(
x=>x.id===channelId
)
:channels[0];

if(!ch) ch=channels[0];

initPlayer(ch);

}
catch(e){
showError();
}

})();

</script>

</body>
</html>
