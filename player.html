<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>NY Cricket Live</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>

<style>

:root{
--orange:#f07020;
--dark:#000;
--card:#111;
--border:rgba(240,112,32,.18);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#fff;
font-family:Rajdhani,sans-serif;
overflow-x:hidden;
}

/* HEADER */

header{
position:fixed;
top:0;
left:0;
right:0;
height:56px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 16px;
background:rgba(10,10,10,.95);
backdrop-filter:blur(12px);
z-index:5000;
border-bottom:1px solid var(--border);
}

.logo{
display:flex;
gap:10px;
align-items:center;
font-family:'Bebas Neue';
font-size:22px;
letter-spacing:2px;
}

.logo span{
color:var(--orange);
}

.live{
background:var(--orange);
padding:4px 10px;
font-size:11px;
font-weight:700;
border-radius:3px;
}

.back{
color:white;
text-decoration:none;
font-size:13px;
border:1px solid #333;
padding:6px 12px;
border-radius:6px;
}

main{
padding-top:56px;
}

/* PLAYER */

.player-wrap{
max-width:900px;
margin:auto;
background:#000;
}

.player-box{
position:relative;
padding-top:56.25%;
background:#000;
}

.shaka-video-container{
position:absolute;
inset:0;
background:#000;
}

video{
width:100%;
height:100%;
object-fit:contain;
}

/* FIX SHAKA CONTROLS */

.shaka-controls-container,
.shaka-bottom-controls{
z-index:9000 !important;
}

.shaka-bottom-controls{
position:relative !important;
}

.shaka-play-pause-button,
.shaka-fullscreen-button,
.shaka-overflow-menu-button{
display:flex !important;
visibility:visible !important;
opacity:1 !important;
}

.shaka-volume-bar-container{
opacity:1 !important;
width:70px !important;
padding:0 6px;
}

.shaka-seek-bar{
background:rgba(255,255,255,.25)!important;
}

.shaka-played-range{
background:var(--orange)!important;
}

/* OVERLAY */

#overlay{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:18px;
background:linear-gradient(
to bottom,
rgba(0,0,0,.25),
rgba(0,0,0,.65)
);
z-index:100;
transition:.35s;
}

#overlay.hide{
opacity:0;
visibility:hidden;
pointer-events:none;
}

#spinner{
width:52px;
height:52px;
border-radius:50%;
border:4px solid rgba(255,255,255,.15);
border-top-color:var(--orange);
animation:spin .8s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

#playButton{
display:none;
width:74px;
height:74px;
border-radius:50%;
background:var(--orange);
align-items:center;
justify-content:center;
cursor:pointer;
box-shadow:0 0 25px rgba(240,112,32,.4);
}

#playButton svg{
width:32px;
height:32px;
fill:white;
margin-left:5px;
}

#overlayText{
font-weight:700;
font-size:14px;
letter-spacing:1px;
}

#watermark{
position:absolute;
left:14px;
top:62%;
width:52px;
opacity:.35;
z-index:500;
pointer-events:none;
}

/* ERROR */

#errorBox{
display:none;
position:absolute;
inset:0;
z-index:10000;
background:#000;
flex-direction:column;
justify-content:center;
align-items:center;
gap:20px;
}

#errorBox button{
padding:11px 30px;
background:var(--orange);
border:0;
color:#fff;
font-weight:700;
cursor:pointer;
}

/* CHANNEL */

.info{
max-width:900px;
margin:auto;
display:flex;
align-items:center;
gap:14px;
padding:16px;
border-bottom:1px solid var(--border);
}

.info img{
width:56px;
height:56px;
border-radius:8px;
background:#111;
}

.channel-name{
font-family:'Bebas Neue';
font-size:22px;
letter-spacing:1px;
}

/* RELATED */

.related{
max-width:900px;
margin:auto;
padding:20px;
}

.title{
font-family:'Bebas Neue';
font-size:20px;
letter-spacing:2px;
margin-bottom:15px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
gap:10px;
}

.card{
background:#111;
border:1px solid var(--border);
border-radius:8px;
overflow:hidden;
text-decoration:none;
color:white;
}

.card.active{
border-color:var(--orange);
}

.card-logo{
height:70px;
display:flex;
justify-content:center;
align-items:center;
background:#1a1a1a;
padding:8px;
}

.card-logo img{
width:100%;
height:100%;
object-fit:contain;
}

.card-name{
padding:8px;
font-size:11px;
text-align:center;
font-weight:700;
}

footer{
padding:30px;
text-align:center;
font-size:11px;
opacity:.6;
}

</style>
</head>
<body>

<header>
<div class="logo">
<span>NY</span> CRICKET
</div>

<div class="live">● LIVE</div>

<a class="back" href="index.html">
All Channels
</a>
</header>

<main>

<div class="player-wrap">

<div class="player-box">

<div class="shaka-video-container" data-shaka-player>

<video autoplay playsinline></video>

<div id="overlay">
<div id="spinner"></div>

<div id="playButton">
<svg viewBox="0 0 24 24">
<path d="M8 5v14l11-7z"/>
</svg>
</div>

<div id="overlayText">
Loading Stream...
</div>
</div>

<img
id="watermark"
src="https://i.postimg.cc/J4m9Dz70/Gemini-Generated-Image-4zvnud4zvnud4zvn-Picsart-Background-Remover.png">

<div id="errorBox">
<div id="errorText">
Stream error
</div>
<button onclick="retryLoad()">
Retry
</button>
</div>

</div>
</div>
</div>

<div class="info">
<img id="logo" src="">
<div>
<div class="channel-name" id="channelName">
Loading...
</div>
<div>LIVE HD STREAM</div>
</div>
</div>

<div class="related">
<div class="title">
MORE CHANNELS
</div>

<div class="grid" id="grid"></div>
</div>

</main>

<footer>
© 2025 NY Cricket Live
</footer>


<script>

const API=
'https://binge-jiotv.pages.dev/data/id.json';

const video=
document.querySelector("video");

const container=
document.querySelector(".shaka-video-container");

const overlay=
document.getElementById("overlay");

const spinner=
document.getElementById("spinner");

const playButton=
document.getElementById("playButton");

const overlayText=
document.getElementById("overlayText");

const errorBox=
document.getElementById("errorBox");

let player;
let currentChannel;
let retries=0;
const MAX_RETRY=3;

const params=
new URLSearchParams(location.search);

const channelId=
params.get("id")||"";

function showPlay(){
spinner.style.display="none";
playButton.style.display="flex";
overlayText.innerText="Tap To Play";
}

function hideOverlay(){
overlay.classList.add("hide");
setTimeout(()=>{
overlay.style.display="none";
},400);
}

async function doPlay(){

try{
video.muted=false;
await video.play();
hideOverlay();
}
catch{

try{
video.muted=true;
await video.play();
hideOverlay();
}
catch{}
}

}

overlay.addEventListener(
"click",
doPlay
);

playButton.addEventListener(
"click",
doPlay
);

function showError(msg){
document.getElementById(
"errorText"
).innerText=msg;

errorBox.style.display="flex";
}

function retryLoad(){
errorBox.style.display="none";
retries=0;
loadStream();
}

async function initPlayer(channel){

currentChannel=channel;

document.title=
channel.name;

document.getElementById(
"channelName"
).innerText=channel.name;

document.getElementById(
"logo"
).src=channel.logo||"";

shaka.polyfill.installAll();

if(
!shaka.Player.isBrowserSupported()
){
showError(
"Browser not supported"
);
return;
}

player=
new shaka.Player(video);

new shaka.ui.Overlay(
player,
container,
video
).configure({

addBigPlayButton:true,

controlPanelElements:[
'play_pause',
'time_and_duration',
'mute',
'volume',
'spacer',
'captions',
'quality',
'language',
'picture_in_picture',
'fullscreen',
'overflow_menu'
]

});

if(channel.keyId&&channel.key){

player.configure({
drm:{
clearKeys:{
[channel.keyId]:
channel.key
}
}
});

}

player.getNetworkingEngine()
.registerRequestFilter(
(type,request)=>{

request.headers.Referer=
"https://www.jiotv.com/";

request.headers.Origin=
"https://www.jiotv.com";

if(channel.cookie){

request.headers.Cookie=
channel.cookie;

if(
!request.uris[0]
.includes("__hdnea__=")
){
request.uris[0]+=
(
request.uris[0]
.includes("?")
?"&":"?"
)+channel.cookie;
}

}

}
);

player.addEventListener(
'error',
e=>{

if(retries<MAX_RETRY){

retries++;

overlay.style.display='flex';
overlay.classList.remove('hide');

overlayText.innerText=
"Retrying "+retries;

setTimeout(
loadStream,
3000*retries
);

}
else{
showError(
"Stream unavailable."
);
}

}
);

loadStream();

}

async function loadStream(){

try{

await player.load(
currentChannel.url
);

retries=0;

video.muted=true;

try{
await video.play();

/* show play button */
video.pause();
showPlay();
}
catch{
showPlay();
}

}
catch{

if(retries>=MAX_RETRY){
showError(
"Failed loading stream"
);
}

}

}

function renderChannels(
channels,
active
){

let html='';

channels.forEach(c=>{

html+=`
<a class="card ${
c.id===active
?'active':''
}" href="?id=${c.id}">
<div class="card-logo">
<img src="${c.logo||''}">
</div>
<div class="card-name">
${c.name}
</div>
</a>
`;

});

document.getElementById(
'grid'
).innerHTML=html;

}

(async()=>{

try{

let res=
await fetch(API);

let data=
await res.json();

let channels=
Array.isArray(data)
?data
:(data.channels||[]);

renderChannels(
channels,
channelId
);

let channel=
channelId
?channels.find(
c=>c.id===channelId
)
:channels[0];

if(!channel){
showError(
'Channel not found'
);
return;
}

await initPlayer(
channel
);

}
catch(e){

showError(
'Failed loading channels'
);

}

})();

</script>

</body>
</html>
