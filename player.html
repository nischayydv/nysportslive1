<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1">

<title>NY Cricket Live</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>

<style>

:root{
--orange:#f07020;
--border:rgba(240,112,32,.18);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#fff;
font-family:Rajdhani,sans-serif;
overflow-x:hidden;
}

/* HEADER */

header{
position:fixed;
top:0;
left:0;
right:0;
height:56px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 16px;
background:rgba(10,10,10,.96);
backdrop-filter:blur(12px);
border-bottom:1px solid var(--border);
z-index:99999;
}

.logo{
font-family:'Bebas Neue';
font-size:22px;
letter-spacing:2px;
}

.logo span{
color:var(--orange);
}

.live-pill{
background:var(--orange);
padding:4px 10px;
border-radius:4px;
font-size:11px;
font-weight:700;
}

.back{
text-decoration:none;
color:#fff;
font-size:13px;
padding:7px 12px;
border:1px solid #333;
border-radius:6px;
}

main{
padding-top:56px;
}

/* PLAYER */

.player-wrap{
max-width:900px;
margin:auto;
background:#000;
}

.player-box{
position:relative;
padding-top:56.25%;
background:#000;
overflow:hidden;
}

.shaka-video-container{
position:absolute;
inset:0;
background:#000;
}

video{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}

/* SHAKA UI FIX */

.shaka-controls-container,
.shaka-bottom-controls{
z-index:9500!important;
}

.shaka-played-range{
background:#f07020!important;
}

.shaka-buffered-range{
background:rgba(255,255,255,.4)!important;
}

.shaka-seek-bar{
background:rgba(255,255,255,.2)!important;
}

.shaka-seek-bar-container{
height:5px!important;
}

.shaka-seek-bar-container:hover{
height:8px!important;
}

.shaka-volume-bar-container{
width:70px!important;
opacity:1!important;
}

/* LIVE BAR */

#liveBadgeBar{
position:absolute;
right:18px;
bottom:70px;
display:flex;
gap:10px;
align-items:center;
padding:8px 14px;
background:rgba(0,0,0,.75);
border:1px solid rgba(240,112,32,.35);
border-radius:30px;
z-index:9400;
font-size:12px;
font-weight:700;
}

#liveDot{
width:8px;
height:8px;
background:red;
border-radius:50%;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
50%{
transform:scale(1.4);
opacity:.5;
}
}

.not-live #liveDot{
background:#999;
animation:none;
}

#goLiveBtn{
display:none;
border:0;
background:#f07020;
color:#fff;
padding:6px 12px;
border-radius:20px;
cursor:pointer;
font-weight:700;
}

/* OVERLAY */

#overlay{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:18px;
z-index:200;
background:linear-gradient(
to bottom,
rgba(0,0,0,.15),
rgba(0,0,0,.65)
);
transition:.3s;
}

#overlay.hide{
opacity:0;
visibility:hidden;
pointer-events:none;
}

#spinner{
width:54px;
height:54px;
border-radius:50%;
border:4px solid rgba(255,255,255,.15);
border-top-color:#f07020;
animation:spin .8s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

#playButton{
display:none;
width:74px;
height:74px;
background:#f07020;
border-radius:50%;
justify-content:center;
align-items:center;
cursor:pointer;
}

#playButton svg{
width:32px;
fill:#fff;
margin-left:4px;
}

/* WATERMARK */

#watermark{
position:absolute;
left:14px;
top:62%;
width:54px;
opacity:.35;
z-index:700;
pointer-events:none;
}

/* ERROR */

#errorBox{
display:none;
position:absolute;
inset:0;
background:#000;
z-index:10000;
justify-content:center;
align-items:center;
flex-direction:column;
gap:22px;
}

#errorBox button{
border:0;
background:#f07020;
color:#fff;
padding:12px 28px;
cursor:pointer;
}

/* INFO */

.info{
max-width:900px;
margin:auto;
padding:18px;
display:flex;
gap:14px;
align-items:center;
border-bottom:1px solid var(--border);
}

.info img{
width:56px;
height:56px;
border-radius:8px;
background:#111;
}

.channel-name{
font-family:'Bebas Neue';
font-size:22px;
}

/* GRID */

.related{
max-width:900px;
margin:auto;
padding:20px;
}

.title{
font-family:'Bebas Neue';
font-size:20px;
margin-bottom:14px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
gap:10px;
}

.card{
text-decoration:none;
color:#fff;
background:#111;
border:1px solid var(--border);
border-radius:8px;
overflow:hidden;
}

.card.active{
border-color:#f07020;
}

.card-logo{
height:70px;
display:flex;
justify-content:center;
align-items:center;
padding:8px;
background:#1a1a1a;
}

.card-logo img{
width:100%;
height:100%;
object-fit:contain;
}

.card-name{
padding:8px;
font-size:11px;
font-weight:700;
text-align:center;
}

footer{
text-align:center;
padding:30px;
font-size:11px;
opacity:.6;
}

</style>
</head>
<body>

<header>
<div class="logo"><span>NY</span> CRICKET</div>
<div class="live-pill">● LIVE</div>
<a href="index.html" class="back">All Channels</a>
</header>

<main>

<div class="player-wrap">
<div class="player-box">

<div class="shaka-video-container">

<video id="video"
autoplay
muted
playsinline></video>

<div id="overlay">
<div id="spinner"></div>

<div id="playButton">
<svg viewBox="0 0 24 24">
<path d="M8 5v14l11-7z"/>
</svg>
</div>

<div id="overlayText">
Loading Stream...
</div>

</div>

<img
id="watermark"
src="https://i.postimg.cc/J4m9Dz70/Gemini-Generated-Image-4zvnud4zvnud4zvn-Picsart-Background-Remover.png">

<div id="liveBadgeBar">
<div id="liveDot"></div>
<div>LIVE</div>
<button id="goLiveBtn">Go Live</button>
</div>

<div id="errorBox">
<div id="errorText">
Stream Error
</div>
<button onclick="retryLoad()">Retry</button>
</div>

</div>
</div>
</div>

<div class="info">
<img id="logo">
<div>
<div class="channel-name" id="channelName">
Loading...
</div>
<div>LIVE HD STREAM</div>
</div>
</div>

<div class="related">
<div class="title">
MORE CHANNELS
</div>
<div id="grid" class="grid"></div>
</div>

</main>

<footer>
© 2025 NY Cricket Live
</footer>


<script>

const API="https://binge-jiotv.pages.dev/data/id.json";

const video=document.getElementById("video");
const container=document.querySelector(".shaka-video-container");
const overlay=document.getElementById("overlay");
const spinner=document.getElementById("spinner");
const playBtn=document.getElementById("playButton");
const goLiveBtn=document.getElementById("goLiveBtn");
const liveBar=document.getElementById("liveBadgeBar");

let player;
let currentChannel;
let retries=0;

const channelId=
new URLSearchParams(location.search)
.get("id")||"";


function showPlay(){
spinner.style.display="none";
playBtn.style.display="flex";
document.getElementById(
"overlayText"
).innerText="Tap To Play";
}

function hideOverlay(){
overlay.classList.add("hide");
}

async function doPlay(){
try{
video.muted=false;
await video.play();
hideOverlay();
}catch(e){}
}

overlay.onclick=doPlay;
playBtn.onclick=doPlay;



function showError(msg){
document.getElementById(
"errorText"
).innerText=msg;

document.getElementById(
"errorBox"
).style.display="flex";
}

function retryLoad(){
document.getElementById(
"errorBox"
).style.display="none";

retries=0;

loadStream();
}

window.retryLoad=retryLoad;



function updateLive(){

if(
!video.seekable ||
!video.seekable.length
)return;

let liveEdge=
video.seekable.end(
video.seekable.length-1
);

let lag=
liveEdge-video.currentTime;

if(lag>15){

liveBar.classList.add(
"not-live"
);

goLiveBtn.style.display=
"inline-block";

}else{

liveBar.classList.remove(
"not-live"
);

goLiveBtn.style.display=
"none";

}

}

setInterval(
updateLive,
2000
);

goLiveBtn.onclick=()=>{
if(video.seekable.length){
video.currentTime=
video.seekable.end(
video.seekable.length-1
);
}
};



async function fetchChannels(){

const r=
await fetch(
API,
{cache:"no-store"}
);

const j=await r.json();

return Array.isArray(j)
?j
:j.channels||[];

}



function renderChannels(
channels,
active
){

let html="";

channels.forEach(c=>{

html+=`
<a class="card ${
c.id===active?"active":""
}" href="?id=${c.id}">

<div class="card-logo">
<img src="${c.logo||""}">
</div>

<div class="card-name">
${c.name}
</div>

</a>
`;

});

document.getElementById(
"grid"
).innerHTML=html;

}



async function initPlayer(ch){

currentChannel=ch;

document.getElementById(
"channelName"
).innerText=ch.name;

document.getElementById(
"logo"
).src=ch.logo||"";

shaka.polyfill.installAll();

player=
new shaka.Player(video);

new shaka.ui.Overlay(
player,
container,
video
).configure({

addBigPlayButton:true,

controlPanelElements:[
"mute",
"play_pause",
"time_and_duration",
"spacer",
"quality",
"picture_in_picture",
"fullscreen"
]

});


if(
ch.keyId &&
ch.key
){
player.configure({
drm:{
clearKeys:{
[ch.keyId]:ch.key
}
}
});
}


player.getNetworkingEngine()
.registerRequestFilter(
(type,request)=>{

request.headers["Referer"]=
"https://www.jiotv.com/";

request.headers["Origin"]=
"https://www.jiotv.com";

if(ch.cookie){

request.headers["Cookie"]=
ch.cookie;

if(
(type===
shaka.net.NetworkingEngine.RequestType.MANIFEST ||
type===
shaka.net.NetworkingEngine.RequestType.SEGMENT)
&&
!request.uris[0].includes(
"__hdnea__"
)
){

let token=
ch.cookie.replace(
"__hdnea__=",
""
);

request.uris[0]+=
(
request.uris[0].includes("?")
?"&":"?"
)+
"__hdnea__="+token;

}

}

}
);


player.configure({
streaming:{
lowLatencyMode:true,
bufferingGoal:15,
rebufferingGoal:3,
safeSeekOffset:5
},
manifest:{
defaultPresentationDelay:5
}
});


player.addEventListener(
"error",
()=>{
if(retries<3){
retries++;
setTimeout(
loadStream,
2500
);
}else{
showError(
"Stream unavailable"
);
}
}
);

loadStream();

}



async function loadStream(){

try{

await player.load(
currentChannel.url
);

retries=0;

await video.play();

setTimeout(
showPlay,
1200
);

}
catch(e){
console.error(e);
showError(
"Cannot load stream"
);
}

}



(async()=>{

try{

const channels=
await fetchChannels();

renderChannels(
channels,
channelId
);

let ch=
channelId
?channels.find(
x=>x.id===channelId
)
:channels[0];

if(!ch)
ch=channels[0];

await initPlayer(ch);

}catch(e){

console.error(e);

showError(
"Failed loading channels"
);

}

})();

</script>

</body>
</html>
