<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NY Cricket Live</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>

<style>

:root{
--orange:#ff6b00;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
background:#000;
color:#fff;
font-family:Rajdhani,sans-serif;
overflow-x:hidden;
}


/* HEADER */

header{
position:fixed;
top:0;
left:0;
right:0;
height:58px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 18px;
background:rgba(0,0,0,.88);
backdrop-filter:blur(12px);
z-index:99999;
}

.logo{
font-family:'Bebas Neue';
font-size:28px;
letter-spacing:2px;
}

.logo span{
color:var(--orange);
}

.live-pill{
background:#e50914;
padding:4px 12px;
border-radius:30px;
font-size:11px;
font-weight:700;
}

.back{
text-decoration:none;
color:#fff;
border:1px solid #444;
padding:7px 13px;
border-radius:8px;
font-size:12px;
}

main{
padding-top:58px;
}



/* PLAYER */

.player-wrap{
max-width:1400px;
margin:auto;
background:#000;
}

.player-box{
position:relative;
padding-top:56.25%;
background:#000;
}

.shaka-video-container{
position:absolute;
inset:0;
background:#000;
}


/* FULL VISIBLE VIDEO */

video{
width:100%;
height:100%;
object-fit:cover;
background:#000;
}



/* SHAKA UI — NO BLACK OVERLAY */

.shaka-controls-container{
background:linear-gradient(
to top,
rgba(0,0,0,.35),
rgba(0,0,0,0)
)!important;
z-index:9500!important;
}

.shaka-bottom-controls{
padding-bottom:16px!important;
}

.shaka-seek-bar-container{
height:4px!important;
margin-bottom:4px!important;
}

.shaka-seek-bar-container:hover{
height:6px!important;
}

.shaka-seek-bar{
background:rgba(255,255,255,.15)!important;
}

.shaka-played-range{
background:#e50914!important;
}

.shaka-buffered-range{
background:rgba(255,255,255,.45)!important;
}

.shaka-volume-bar-container{
width:90px!important;
}

/* LIVE EDGE TAG */
.shaka-seek-bar-container:after{
content:'LIVE';
position:absolute;
right:-42px;
top:-8px;
background:#ff2b2b;
padding:3px 10px;
border-radius:20px;
font-size:10px;
font-weight:700;
}



/* LOADING ONLY (NO BLACK OVERLAY) */

#overlay{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:18px;
background:transparent;
z-index:700;
pointer-events:none;
}

#overlay.hide{
display:none;
}

#spinner{
width:58px;
height:58px;
border-radius:50%;
border:4px solid rgba(255,255,255,.14);
border-top-color:var(--orange);
animation:spin .8s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg)
}
}

#overlayText{
font-size:13px;
font-weight:700;
letter-spacing:1px;
}



/* WATERMARK */

#watermark{
position:absolute;
left:14px;
top:62%;
width:54px;
opacity:.28;
z-index:1000;
pointer-events:none;
}



/* HOTSTAR STYLE LIVE BAR */

#livePanel{
position:absolute;
right:14px;
bottom:58px;
display:flex;
align-items:center;
gap:8px;
padding:6px 11px;
background:rgba(0,0,0,.7);
border-radius:25px;
backdrop-filter:blur(8px);
border:1px solid rgba(255,255,255,.12);
z-index:9600;
font-size:11px;
font-weight:700;
}

#liveDot{
width:7px;
height:7px;
border-radius:50%;
background:#ff2b2b;
animation:pulse 1.2s infinite;
}

@keyframes pulse{
50%{
transform:scale(1.4);
opacity:.5;
}
}

.behind #liveDot{
background:#999;
animation:none;
}

#goLiveBtn{
display:none;
border:0;
background:#e50914;
color:#fff;
padding:4px 10px;
font-size:10px;
font-weight:700;
border-radius:16px;
cursor:pointer;
}



/* ERROR */

#errorBox{
display:none;
position:absolute;
inset:0;
background:#000;
z-index:999999;
justify-content:center;
align-items:center;
flex-direction:column;
gap:18px;
}

#errorBox button{
background:#e50914;
border:0;
padding:12px 30px;
color:#fff;
cursor:pointer;
}



/* INFO */

.info{
max-width:1200px;
margin:auto;
padding:18px;
display:flex;
gap:14px;
align-items:center;
border-bottom:1px solid #222;
}

.info img{
width:56px;
height:56px;
border-radius:10px;
background:#111;
}

.channel-name{
font-family:'Bebas Neue';
font-size:26px;
}



/* CHANNEL GRID */

.related{
max-width:1200px;
margin:auto;
padding:25px;
}

.title{
font-family:'Bebas Neue';
font-size:25px;
margin-bottom:16px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:12px;
}

.card{
text-decoration:none;
color:#fff;
background:#111;
border-radius:10px;
overflow:hidden;
border:1px solid #222;
transition:.2s;
}

.card:hover{
transform:scale(1.03);
}

.card.active{
border:1px solid #e50914;
}

.card-logo{
height:84px;
display:flex;
justify-content:center;
align-items:center;
padding:8px;
background:#1a1a1a;
}

.card-logo img{
width:100%;
height:100%;
object-fit:contain;
}

.card-name{
padding:10px;
text-align:center;
font-size:11px;
font-weight:700;
}

footer{
text-align:center;
padding:30px;
font-size:11px;
opacity:.55;
}

</style>
</head>
<body>


<header>
<div class="logo">
<span>NY</span> CRICKET
</div>

<div class="live-pill">
● LIVE
</div>

<a href="index.html" class="back">
Channels
</a>
</header>



<main>

<div class="player-wrap">
<div class="player-box">

<div class="shaka-video-container">

<video id="video"
autoplay
muted
playsinline>
</video>


<div id="overlay">
<div id="spinner"></div>
<div id="overlayText">
Connecting...
</div>
</div>


<img
id="watermark"
src="https://i.postimg.cc/J4m9Dz70/Gemini-Generated-Image-4zvnud4zvnud4zvn-Picsart-Background-Remover.png">


<div id="livePanel">
<div id="liveDot"></div>
<div>LIVE</div>
<button id="goLiveBtn">
Go Live
</button>
</div>


<div id="errorBox">
<h2>Stream Error</h2>
<button onclick="loadStream()">
Retry
</button>
</div>

</div>
</div>
</div>



<div class="info">
<img id="logo">
<div>
<div
id="channelName"
class="channel-name">
Loading...
</div>
<div>LIVE HD DVR STREAM</div>
</div>
</div>



<div class="related">
<div class="title">
MORE CHANNELS
</div>

<div id="grid" class="grid">
</div>
</div>

</main>

<footer>
© 2026 NY Cricket Live
</footer>



<script>

const API=
"https://binge-jiotv.pages.dev/data/id.json";

const video=
document.getElementById(
"video"
);

const container=
document.querySelector(
".shaka-video-container"
);

let player;
let currentChannel;
let retries=0;

const channelId=
new URLSearchParams(
location.search
).get("id")||"";



function hideOverlay(){
document.getElementById(
"overlay"
).classList.add(
"hide"
);
}



function showError(){
document.getElementById(
"errorBox"
).style.display="flex";
}



async function fetchChannels(){

let r=
await fetch(
API,
{
cache:"no-store"
}
);

let d=
await r.json();

return Array.isArray(
d.channels
)
?d.channels:d;

}



function renderChannels(
channels
){

let html='';

channels.forEach(c=>{

html+=`
<a class="card ${
c.id===channelId
?'active':''
}" href="?id=${c.id}">
<div class="card-logo">
<img src="${c.logo}">
</div>
<div class="card-name">
${c.name}
</div>
</a>
`;

});

document.getElementById(
"grid"
).innerHTML=html;

}



async function initPlayer(ch){

currentChannel=ch;

document.getElementById(
"channelName"
).innerText=
ch.name;

document.getElementById(
"logo"
).src=
ch.logo;


shaka.polyfill.installAll();

player=
new shaka.Player(
video
);


new shaka.ui.Overlay(
player,
container,
video
).configure({

addBigPlayButton:false,

controlPanelElements:[
"mute",
"play_pause",
"time_and_duration",
"spacer",
"quality",
"overflow_menu",
"fullscreen"
]

});


if(
ch.keyId &&
ch.key
){

player.configure({
drm:{
clearKeys:{
[ch.keyId]:
ch.key
}
}
});

}



player.getNetworkingEngine()
.registerRequestFilter(
(type,request)=>{

request.headers.Referer=
"https://www.jiotv.com/";

request.headers.Origin=
"https://www.jiotv.com";


if(ch.cookie){

request.headers.Cookie=
ch.cookie;

let token=
ch.cookie.replace(
"__hdnea__=",
""
);


if(
(type===0||type===1)
&&
!request.uris[0]
.includes(
"__hdnea__"
)
){

let sep=
request.uris[0]
.includes("?")
?"&":"?";

request.uris[0]+=
sep+
"__hdnea__="+
token;

}

}

}
);



player.configure({

streaming:{
lowLatencyMode:true,
bufferingGoal:15,
rebufferingGoal:3,
safeSeekOffset:5
},

manifest:{
defaultPresentationDelay:5
}

});



player.addEventListener(
"error",
()=>{
if(retries<4){
retries++;
setTimeout(
loadStream,
2000
);
}else{
showError();
}
}
);


await loadStream();

setupLiveDVR();

}



async function loadStream(){

try{

await player.load(
currentChannel.url
);

retries=0;

await video.play();

hideOverlay();

}
catch(e){

console.log(e);

showError();

}

}



/* WORKING GO LIVE */

function setupLiveDVR(){

setInterval(()=>{

if(!player) return;

let r=
player.seekRange();

if(!r||!r.end)
return;

let liveEdge=
r.end;

let latency=
liveEdge-
video.currentTime;

let panel=
document.getElementById(
"livePanel"
);

let btn=
document.getElementById(
"goLiveBtn"
);


if(latency>8){

panel.classList.add(
"behind"
);

btn.style.display=
"inline-block";

}else{

panel.classList.remove(
"behind"
);

btn.style.display=
"none";

}

},1000);



document.getElementById(
"goLiveBtn"
).onclick=()=>{

let r=
player.seekRange();

if(r&&r.end){
player.seek(
r.end-1
);
}

};

}



(async()=>{

try{

let channels=
await fetchChannels();

renderChannels(
channels
);

let ch=
channelId
?channels.find(
x=>x.id===channelId
)
:channels[0];

if(!ch)
ch=channels[0];

initPlayer(ch);

}
catch(e){

showError();

}

})();

</script>

</body>
</html>
