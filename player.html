<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>NY Cricket Live</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>

<style>

:root{
--orange:#f07020;
--border:rgba(240,112,32,.18);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#fff;
font-family:Rajdhani,sans-serif;
overflow-x:hidden;
}

/* HEADER */

header{
position:fixed;
top:0;
left:0;
right:0;
height:56px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
background:rgba(10,10,10,.96);
backdrop-filter:blur(14px);
border-bottom:1px solid var(--border);
z-index:9999;
}

.logo{
display:flex;
gap:10px;
align-items:center;
font-family:'Bebas Neue';
font-size:22px;
letter-spacing:2px;
}

.logo span{
color:var(--orange);
}

.live-pill{
background:var(--orange);
padding:4px 10px;
font-size:11px;
font-weight:700;
border-radius:3px;
}

.back{
text-decoration:none;
color:#fff;
font-size:13px;
border:1px solid #333;
padding:7px 12px;
border-radius:6px;
}

main{
padding-top:56px;
}

/* PLAYER */

.player-wrap{
max-width:900px;
margin:auto;
background:#000;
}

.player-box{
position:relative;
padding-top:56.25%;
}

.shaka-video-container{
position:absolute;
inset:0;
background:#000;
}

video{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}

/* FIX SHAKA CONTROLS */

.shaka-controls-container,
.shaka-bottom-controls{
z-index:9500!important;
}

.shaka-play-pause-button,
.shaka-fullscreen-button,
.shaka-overflow-menu-button{
display:flex!important;
visibility:visible!important;
opacity:1!important;
}

.shaka-volume-bar-container{
width:72px!important;
opacity:1!important;
}

.shaka-seek-bar{
background:rgba(255,255,255,.22)!important;
}

.shaka-played-range{
background:#f07020!important;
}

.shaka-buffered-range{
background:rgba(255,255,255,.45)!important;
}

.shaka-seek-bar-container{
height:5px!important;
}

.shaka-seek-bar-container:hover{
height:8px!important;
}

/* HOTSTAR LIVE PILL ON SEEK BAR */

.shaka-seek-bar-container::after{
content:'LIVE';
position:absolute;
right:-48px;
top:-8px;
background:#ff2b2b;
padding:4px 10px;
font-size:10px;
border-radius:18px;
font-weight:700;
}

/* OVERLAY */

#overlay{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:18px;
z-index:120;
background:linear-gradient(
to bottom,
rgba(0,0,0,.25),
rgba(0,0,0,.68)
);
transition:.35s;
}

#overlay.hide{
opacity:0;
visibility:hidden;
pointer-events:none;
}

#spinner{
width:54px;
height:54px;
border-radius:50%;
border:4px solid rgba(255,255,255,.18);
border-top-color:#f07020;
animation:spin .8s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

#playButton{
display:none;
width:74px;
height:74px;
background:#f07020;
border-radius:50%;
justify-content:center;
align-items:center;
cursor:pointer;
box-shadow:0 0 25px rgba(240,112,32,.45);
}

#playButton svg{
width:32px;
height:32px;
fill:#fff;
margin-left:4px;
}

#overlayText{
font-size:14px;
font-weight:700;
letter-spacing:1px;
}

/* WATERMARK */

#watermark{
position:absolute;
left:14px;
top:62%;
width:54px;
opacity:.35;
pointer-events:none;
z-index:700;
}

/* LIVE DVR BAR */

#liveBadgeBar{
position:absolute;
right:18px;
bottom:64px;
display:flex;
gap:10px;
align-items:center;
padding:8px 12px;
border-radius:30px;
background:rgba(0,0,0,.75);
backdrop-filter:blur(8px);
border:1px solid rgba(240,112,32,.35);
z-index:9400;
font-size:12px;
font-weight:700;
}

#liveDot{
width:9px;
height:9px;
background:#ff2b2b;
border-radius:50%;
animation:pulse 1.4s infinite;
}

@keyframes pulse{
50%{
transform:scale(1.45);
opacity:.5;
}
}

.not-live #liveDot{
background:#999;
animation:none;
}

#goLiveBtn{
display:none;
background:#f07020;
color:#fff;
border:0;
padding:7px 14px;
border-radius:20px;
cursor:pointer;
font-weight:700;
}

/* ERROR */

#errorBox{
display:none;
position:absolute;
inset:0;
background:#000;
z-index:10000;
flex-direction:column;
justify-content:center;
align-items:center;
gap:20px;
}

#errorBox button{
padding:11px 28px;
background:#f07020;
border:0;
color:white;
font-weight:700;
cursor:pointer;
}

/* INFO */

.info{
max-width:900px;
margin:auto;
padding:18px;
display:flex;
gap:14px;
align-items:center;
border-bottom:1px solid var(--border);
}

.info img{
width:56px;
height:56px;
background:#111;
border-radius:8px;
}

.channel-name{
font-family:'Bebas Neue';
font-size:23px;
}

/* RELATED */

.related{
max-width:900px;
margin:auto;
padding:20px;
}

.title{
font-family:'Bebas Neue';
font-size:20px;
letter-spacing:2px;
margin-bottom:14px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
gap:10px;
}

.card{
text-decoration:none;
background:#111;
border:1px solid var(--border);
border-radius:8px;
overflow:hidden;
color:#fff;
}

.card.active{
border-color:#f07020;
}

.card-logo{
height:70px;
display:flex;
justify-content:center;
align-items:center;
background:#1a1a1a;
padding:8px;
}

.card-logo img{
width:100%;
height:100%;
object-fit:contain;
}

.card-name{
padding:8px;
text-align:center;
font-size:11px;
font-weight:700;
}

footer{
padding:28px;
text-align:center;
font-size:11px;
opacity:.65;
}

</style>
</head>
<body>

<header>
<div class="logo">
<span>NY</span> CRICKET
</div>

<div class="live-pill">
● LIVE
</div>

<a class="back" href="index.html">
All Channels
</a>
</header>

<main>

<div class="player-wrap">
<div class="player-box">

<div class="shaka-video-container">

<video playsinline></video>

<div id="overlay">
<div id="spinner"></div>

<div id="playButton">
<svg viewBox="0 0 24 24">
<path d="M8 5v14l11-7z"/>
</svg>
</div>

<div id="overlayText">
Loading Stream...
</div>
</div>

<img
id="watermark"
src="https://i.postimg.cc/J4m9Dz70/Gemini-Generated-Image-4zvnud4zvnud4zvn-Picsart-Background-Remover.png">

<div id="liveBadgeBar">
<div id="liveDot"></div>
<div>LIVE</div>
<button id="goLiveBtn">
Go Live
</button>
</div>

<div id="errorBox">
<div id="errorText">
Stream Error
</div>

<button onclick="retryLoad()">
Retry
</button>
</div>

</div>
</div>
</div>


<div class="info">
<img id="logo" src="">
<div>
<div
class="channel-name"
id="channelName">
Loading...
</div>
<div>LIVE HD STREAM</div>
</div>
</div>


<div class="related">
<div class="title">
MORE CHANNELS
</div>

<div
class="grid"
id="grid">
</div>

</div>

</main>

<footer>
© 2025 NY Cricket Live
</footer>


<script>
const API='https://binge-jiotv.pages.dev/data/id.json';

const video=document.querySelector("video");
const container=document.querySelector(".shaka-video-container");

const overlay=document.getElementById("overlay");
const spinner=document.getElementById("spinner");
const playButton=document.getElementById("playButton");
const overlayText=document.getElementById("overlayText");
const errorBox=document.getElementById("errorBox");

let player;
let currentChannel;
let retries=0;
const MAX_RETRY=2;

const channelId=
new URLSearchParams(location.search).get("id")||"";


function showPlay(){
spinner.style.display='none';
playButton.style.display='flex';
overlayText.textContent='Tap To Play';
}

function hideOverlay(){
overlay.classList.add('hide');
setTimeout(()=>{
overlay.style.display='none';
},400);
}

async function doPlay(){
try{
await video.play();
hideOverlay();
}catch(e){
console.log(e);
}
}

overlay.onclick=doPlay;
playButton.onclick=doPlay;

function showError(msg){
document.getElementById(
'errorText'
).textContent=msg;

errorBox.style.display='flex';
}

function retryLoad(){
errorBox.style.display='none';
retries=0;
loadStream();
}

async function initPlayer(ch){

currentChannel=ch;

document.getElementById(
'channelName'
).textContent=ch.name;

document.getElementById(
'logo'
).src=ch.logo||'';

shaka.polyfill.installAll();

if(!shaka.Player.isBrowserSupported()){
showError("Browser not supported");
return;
}

player=new shaka.Player(video);

const ui=
new shaka.ui.Overlay(
player,
container,
video
);

ui.configure({
addBigPlayButton:true,
controlPanelElements:[
'play_pause',
'time_and_duration',
'mute',
'volume',
'spacer',
'quality',
'fullscreen',
'overflow_menu'
]
});


/* VERY IMPORTANT:
Remove broken cookie URL rewriting.
Only light headers.
*/
player.getNetworkingEngine()
.registerRequestFilter(
(type,request)=>{

request.headers["Referer"]=
"https://www.jiotv.com/";

request.headers["Origin"]=
"https://www.jiotv.com";

/* DO NOT append cookies to URLs
removed:
request.uris[0]+=cookie
this was breaking streams
*/

if(
ch.cookie &&
type===shaka.net.NetworkingEngine.RequestType.MANIFEST
){
request.headers["Cookie"]=ch.cookie;
}

}
);


player.configure({

streaming:{
bufferingGoal:15,
rebufferingGoal:3,
bufferBehind:30,

retryParameters:{
timeout:12000,
maxAttempts:2,
baseDelay:2000
}
},

manifest:{
retryParameters:{
timeout:10000,
maxAttempts:2
}
}

});


player.addEventListener(
'error',
onPlayerError
);

await loadStream();

}


function onPlayerError(event){

console.log(
"Player error:",
event.detail
);

if(retries<MAX_RETRY){

retries++;

overlay.style.display='flex';
overlay.classList.remove('hide');

overlayText.textContent=
'Retrying '+retries;

setTimeout(
loadStream,
2500
);

}
else{

showError(
'Stream unavailable. Try another channel.'
);

}

}


async function loadStream(){

try{

overlayText.textContent=
'Connecting...';

await player.load(
currentChannel.url
);

retries=0;

/* Important:
do not auto pause after play
*/

video.muted=true;

try{
await video.play();

/* show user play option too */
setTimeout(()=>{
showPlay();
},1000);

}
catch{
showPlay();
}

}
catch(err){

console.error(
"Load failed",
err
);

if(retries<MAX_RETRY){

retries++;

setTimeout(
loadStream,
2500
);

}else{

showError(
'Cannot load stream'
);

}

}

}



function renderChannels(
channels,
active
){

let html='';

channels.forEach(c=>{

html+=`
<a class="card ${
c.id===active?'active':''
}" href="?id=${c.id}">
<div class="card-logo">
<img src="${c.logo||''}">
</div>
<div class="card-name">
${c.name}
</div>
</a>
`;

});

document.getElementById(
'grid'
).innerHTML=html;

}



(async()=>{

try{

const res=
await fetch(API);

const data=
await res.json();

const channels=
Array.isArray(data)
?data
:(data.channels||[]);

renderChannels(
channels,
channelId
);

const ch=
channelId
?channels.find(
c=>c.id===channelId
)
:channels[0];

if(!ch){
showError(
'Channel not found'
);
return;
}

await initPlayer(ch);

}
catch(e){

console.error(e);

showError(
'Failed loading channels'
);

}

})();

</script>


</body>
</html>
