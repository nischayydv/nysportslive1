<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NY Cricket Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #f07020;
    --orange-glow: rgba(240,112,32,0.35);
    --white: #ffffff;
    --dark: #0a0a0a;
    --card: #111111;
    --border: rgba(240,112,32,0.18);
    --text-dim: rgba(255,255,255,0.55);
  }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--dark);
    color: var(--white);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Animated BG ── */
  body::before {
    content:'';
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 60% 40% at 15% 20%, rgba(240,112,32,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 85% 80%, rgba(240,112,32,0.05) 0%, transparent 55%),
      repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(255,255,255,0.015) 60px),
      repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(255,255,255,0.015) 60px);
    pointer-events:none;
  }

  /* ── Header ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
  }
  .logo-wrap { display:flex; align-items:center; gap:12px; text-decoration:none; }
  .logo-wrap img { height:42px; width:42px; object-fit:contain; filter:drop-shadow(0 0 10px var(--orange-glow)); }
  .logo-text { font-family:'Bebas Neue', sans-serif; font-size:22px; letter-spacing:2px; color:var(--white); line-height:1; }
  .logo-text span { color:var(--orange); }
  .live-badge {
    background: var(--orange); color:#fff;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:10px;
    padding: 2px 7px; border-radius:2px; letter-spacing:1.5px;
    animation: pulseBadge 2s infinite;
  }
  @keyframes pulseBadge {
    0%,100% { opacity:1; } 50% { opacity:0.7; }
  }

  /* ── Hero ── */
  .hero {
    position:relative; z-index:1;
    text-align:center;
    padding: 60px 24px 40px;
  }
  .hero h1 {
    font-family:'Bebas Neue', sans-serif;
    font-size: clamp(42px,8vw,96px);
    letter-spacing: 4px;
    line-height:1;
    background: linear-gradient(135deg, #fff 40%, var(--orange) 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .hero p {
    margin-top:12px; color:var(--text-dim); font-size:15px; letter-spacing:1px;
    font-weight:500;
  }
  .hero-line {
    width:80px; height:3px; margin:20px auto 0;
    background: linear-gradient(90deg, transparent, var(--orange), transparent);
  }

  /* ── Loading state ── */
  #loadingState {
    display:flex; flex-direction:column; align-items:center; gap:16px;
    padding:80px 24px; color:var(--text-dim);
  }
  .spinner-ring {
    width:48px; height:48px; border:3px solid rgba(240,112,32,0.2);
    border-top-color:var(--orange); border-radius:50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ── Channel Grid ── */
  #channelGrid {
    position:relative; z-index:1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    padding: 0 24px 60px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .channel-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    animation: fadeUp 0.4s ease both;
  }
  .channel-card:hover {
    transform: translateY(-4px);
    border-color: var(--orange);
    box-shadow: 0 8px 32px rgba(240,112,32,0.2);
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .card-logo {
    width:100%; height:110px;
    background: #181818;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative;
  }
  .card-logo img {
    width:100%; height:100%; object-fit:contain; padding:12px;
    transition: transform 0.3s ease;
  }
  .channel-card:hover .card-logo img { transform:scale(1.06); }
  .card-logo::after {
    content:'▶';
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:32px; color:rgba(255,255,255,0.9);
    background:rgba(240,112,32,0.75);
    opacity:0; transition:opacity 0.2s;
  }
  .channel-card:hover .card-logo::after { opacity:1; }
  .card-info { padding:10px 12px 12px; }
  .card-name {
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px;
    letter-spacing:0.5px; color:var(--white); line-height:1.3;
  }
  .card-live {
    display:inline-flex; align-items:center; gap:5px;
    margin-top:5px; font-size:11px; font-weight:600; color:var(--orange);
    letter-spacing:1px;
  }
  .card-live::before {
    content:''; width:6px; height:6px; border-radius:50%; background:var(--orange);
    animation: pulseDot 1.5s infinite;
  }
  @keyframes pulseDot {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.5; transform:scale(1.3); }
  }

  /* ── Error ── */
  #errorState {
    display:none; flex-direction:column; align-items:center; gap:12px;
    padding:80px 24px; color:#f66; font-size:15px; text-align:center;
  }

  /* ── Footer ── */
  footer {
    position:relative; z-index:1; text-align:center;
    color:var(--text-dim); font-size:12px; letter-spacing:0.5px;
    padding:0 24px 24px;
    border-top:1px solid var(--border);
    padding-top:16px;
  }
</style>
</head>
<body>

<header>
  <a class="logo-wrap" href="index.html">
    <img src="https://i.postimg.cc/J4m9Dz70/Gemini-Generated-Image-4zvnud4zvnud4zvn-Picsart-Background-Remover.png" alt="NY Cricket Live">
    <div>
      <div class="logo-text"><span>NY</span> CRICKET LIVE</div>
    </div>
  </a>
  <div class="live-badge">● LIVE</div>
</header>

<div class="hero">
  <h1>WATCH LIVE<br>CRICKET</h1>
  <p>HD Streams · Star Sports · No Subscription</p>
  <div class="hero-line"></div>
</div>

<div id="loadingState">
  <div class="spinner-ring"></div>
  <div>Fetching live channels…</div>
</div>

<div id="channelGrid"></div>

<div id="errorState">
  <div>⚠ Could not load channels</div>
  <button onclick="loadChannels()" style="padding:8px 20px;background:var(--orange);border:none;border-radius:4px;color:#fff;cursor:pointer;font-family:Rajdhani,sans-serif;font-size:14px;font-weight:700">↺ Retry</button>
</div>

<footer>
  © 2025 NY Cricket Live · For educational purposes only
</footer>

<script>
const API = 'https://binge-jiotv.pages.dev/data/id.json';

async function loadChannels() {
  document.getElementById('loadingState').style.display = 'flex';
  document.getElementById('channelGrid').innerHTML = '';
  document.getElementById('errorState').style.display = 'none';
  try {
    const res = await fetch(API);
    const data = await res.json();
    const channels = Array.isArray(data) ? data : (data.channels || data.data || []);
    document.getElementById('loadingState').style.display = 'none';
    renderChannels(channels);
  } catch(e) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('errorState').style.display = 'flex';
  }
}

function renderChannels(channels) {
  const grid = document.getElementById('channelGrid');
  channels.forEach((ch, i) => {
    const card = document.createElement('a');
    card.className = 'channel-card';
    card.href = `player.html?id=${encodeURIComponent(ch.id)}`;
    card.style.animationDelay = (i * 0.04) + 's';
    card.innerHTML = `
      <div class="card-logo">
        <img src="${ch.logo || ''}" alt="${ch.name}" onerror="this.src='https://i.postimg.cc/J4m9Dz70/Gemini-Generated-Image-4zvnud4zvnud4zvn-Picsart-Background-Remover.png'">
      </div>
      <div class="card-info">
        <div class="card-name">${ch.name}</div>
        <div class="card-live">LIVE NOW</div>
      </div>
    `;
    grid.appendChild(card);
  });
}

loadChannels();
</script>
</body>
</html>
