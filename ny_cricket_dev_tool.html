<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NY Cricket Dev Tools</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        .dt{background:#0a0a0a;border:1px solid #1f1f1f;border-radius:10px;font-family:'Courier New',monospace;overflow:hidden;color:#d4d4d4;min-height:520px;display:flex;flex-direction:column;max-width: 900px;margin: 20px auto;}
        .dt-bar{background:#111;border-bottom:1px solid #1f1f1f;padding:8px 14px;display:flex;align-items:center;gap:10px}
        .dot{width:11px;height:11px;border-radius:50%}
        .dt-title{flex:1;text-align:center;font-size:11px;color:#555;letter-spacing:2px;text-transform:uppercase}
        .dt-tabs{display:flex;border-bottom:1px solid #1f1f1f;background:#0d0d0d}
        .tab{padding:8px 16px;font-size:11px;cursor:pointer;color:#555;letter-spacing:1px;border-bottom:2px solid transparent;transition:all .15s}
        .tab.on{color:#f07020;border-color:#f07020}
        .tab:hover:not(.on){color:#999}
        .pane{display:none;flex:1;flex-direction:column}
        .pane.on{display:flex}

        /* Terminal */
        .term{flex:1;overflow-y:auto;padding:12px 14px;font-size:12px;line-height:1.7;max-height:350px;background: #050505;}
        .term::-webkit-scrollbar{width:4px}.term::-webkit-scrollbar-thumb{background:#2a2a2a}
        .t-line{display:block;white-space:pre-wrap;word-break:break-all}
        .t-ok{color:#3fb950}.t-err{color:#f85149}.t-warn{color:#e3b341}.t-info{color:#58a6ff}.t-dim{color:#555}.t-orange{color:#f07020}.t-val{color:#ce9178}
        .term-input-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid #1a1a1a;background:#0d0d0d}
        .term-prompt{color:#f07020;font-size:12px;white-space:nowrap}
        .term-input{flex:1;background:transparent;border:none;outline:none;color:#d4d4d4;font-family:'Courier New',monospace;font-size:12px;caret-color:#f07020}

        /* Sections */
        .section{padding:12px 14px;border-bottom:1px solid #161616}
        .sec-label{font-size:10px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
        .field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
        .field{background:#111;border:1px solid #1f1f1f;border-radius:5px;padding:7px 10px}
        .field label{display:block;font-size:10px;color:#555;margin-bottom:3px;letter-spacing:1px}
        .field input,.field select,.field textarea{width:100%;background:transparent;border:none;outline:none;color:#ce9178;font-family:'Courier New',monospace;font-size:11px;resize:none}
        .field textarea{height:44px}
        .field.full{grid-column:1/-1}
        .btn-row{display:flex;gap:8px;padding:10px 14px 12px;flex-wrap:wrap}
        .btn{padding:6px 14px;border-radius:4px;border:none;cursor:pointer;font-family:'Courier New',monospace;font-size:11px;font-weight:600;letter-spacing:.8px;transition:opacity .15s}
        .btn:hover{opacity:.8}
        .btn-orange{background:#f07020;color:#0a0a0a}
        .btn-gray{background:#1f1f1f;color:#ccc}
        .btn-red{background:#3d1a1a;color:#f85149;border:1px solid #5a1a1a}
        .btn-green{background:#1a2e1a;color:#3fb950;border:1px solid #1a4d1a}

        /* JSON viewer */
        .json-area{flex:1;padding:12px 14px;font-size:11px;line-height:1.6;overflow-y:auto;max-height:380px}
        .json-area::-webkit-scrollbar{width:4px}.json-area::-webkit-scrollbar-thumb{background:#2a2a2a}
        .j-key{color:#9cdcfe}.j-str{color:#ce9178}.j-num{color:#b5cea8}.j-bool{color:#569cd6}.j-null{color:#569cd6}

        /* Status bar */
        .status-bar{background:#1a1a1a;border-top:1px solid #1f1f1f;padding:5px 14px;display:flex;align-items:center;gap:12px;font-size:10px;color:#555}
        .s-dot{width:7px;height:7px;border-radius:50%;background:#3fb950;animation:blink 2s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

        /* Table */
        .ch-table{width:100%;border-collapse:collapse;font-size:11px}
        .ch-table th{color:#555;text-align:left;padding:5px 8px;border-bottom:1px solid #1a1a1a;font-weight:400;letter-spacing:1px;text-transform:uppercase;font-size:10px}
        .ch-table td{padding:5px 8px;border-bottom:1px solid #111;vertical-align:middle}
        .ch-table tr:hover td{background:#111}
        .copy-btn{background:#1f1f1f;border:none;color:#888;cursor:pointer;font-size:10px;padding:2px 6px;border-radius:3px;font-family:'Courier New',monospace}
        .copy-btn:hover{color:#f07020}
        .badge{font-size:9px;padding:1px 5px;border-radius:2px;letter-spacing:.5px}
        .b-ok{background:#1a2e1a;color:#3fb950}.b-err{background:#3d1a1a;color:#f85149}.b-warn{background:#2e2010;color:#e3b341}
    </style>
</head>
<body>

<div class="dt">
  <div class="dt-bar">
    <div class="dot" style="background:#f85149"></div>
    <div class="dot" style="background:#e3b341"></div>
    <div class="dot" style="background:#3fb950"></div>
    <div class="dt-title">NY CRICKET LIVE — DEV TOOLS</div>
  </div>

  <div class="dt-tabs">
    <div class="tab on" onclick="switchTab('terminal')">TERMINAL</div>
    <div class="tab" onclick="switchTab('stream')">STREAM LAB</div>
    <div class="tab" onclick="switchTab('channels')">CHANNELS</div>
    <div class="tab" onclick="switchTab('json')">JSON VIEW</div>
  </div>

  <div class="pane on" id="pane-terminal">
    <div class="term" id="term"></div>
    <div class="term-input-row">
      <span class="term-prompt">NY▸</span>
      <input class="term-input" id="termIn" placeholder="type command... (help)" spellcheck="false" autocomplete="off">
    </div>
  </div>

  <div class="pane" id="pane-stream">
    <div class="section">
      <div class="sec-label">Stream Config</div>
      <div class="field-row">
        <div class="field full">
          <label>MPD / M3U8 URL</label>
          <input id="s-url" value="https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/WDVLive/index.mpd">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Key ID</label>
          <input id="s-keyid" value="400131994b445d8c8817202248760fda">
        </div>
        <div class="field">
          <label>Key</label>
          <input id="s-key" value="2d56cb6f07a75b9aff165d534ae2bfc4">
        </div>
      </div>
      <div class="field-row">
        <div class="field full">
          <label>Cookie</label>
          <textarea id="s-cookie" placeholder="__hdnea__=st=..."></textarea>
        </div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-orange" onclick="buildURL()">BUILD URL ↗</button>
      <button class="btn btn-green" onclick="testStream()">TEST STREAM</button>
      <button class="btn btn-gray" onclick="fetchAPI()">FETCH API</button>
      <button class="btn btn-red" onclick="clearStream()">CLEAR</button>
    </div>
    <div class="term" id="stream-log" style="max-height:140px;padding:8px 14px"></div>
  </div>

  <div class="pane" id="pane-channels">
    <div class="section" style="flex:1;overflow-y:auto;padding-bottom:0">
      <div class="sec-label" style="display:flex;align-items:center;justify-content:space-between">
        <span>Live Channel List</span>
        <button class="btn btn-gray" style="padding:3px 10px;font-size:10px" onclick="loadChannels()">↻ RELOAD</button>
      </div>
      <div style="overflow-x:auto">
        <table class="ch-table" id="ch-table">
          <tr><th>ID</th><th>Name</th><th>DRM</th><th>Cookie</th><th>URL</th></tr>
          <tr><td colspan="5" style="color:#555;text-align:center;padding:16px">Click RELOAD to fetch channels</td></tr>
        </table>
      </div>
    </div>
  </div>

  <div class="pane" id="pane-json">
    <div style="padding:8px 14px;border-bottom:1px solid #161616;display:flex;gap:8px;align-items:center">
      <input id="json-url" style="flex:1;background:#111;border:1px solid #1f1f1f;border-radius:4px;padding:5px 9px;color:#ce9178;font-family:'Courier New',monospace;font-size:11px;outline:none" value="https://binge-jiotv.pages.dev/data/id.json">
      <button class="btn btn-orange" onclick="loadJSON()" style="padding:5px 12px">LOAD</button>
      <button class="btn btn-gray" onclick="copyJSON()" style="padding:5px 12px">COPY</button>
    </div>
    <div class="json-area" id="json-area"><span style="color:#555">Press LOAD to fetch JSON…</span></div>
  </div>

  <div class="status-bar">
    <div class="s-dot"></div>
    <span id="stat-txt">Ready</span>
    <span style="margin-left:auto" id="stat-time"></span>
  </div>
</div>

<script>
const API = 'https://binge-jiotv.pages.dev/data/id.json';
const PLAYER_BASE = 'https://ny-sports-live.vercel.app/player.html';
let rawJSON = null;

function ts(){const n=new Date();return n.toTimeString().slice(0,8)}
function setStatus(t){document.getElementById('stat-txt').textContent=t;document.getElementById('stat-time').textContent=ts()}

function switchTab(id){
  const ids=['terminal','stream','channels','json'];
  document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('on',ids[i]===id)});
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));
  document.getElementById('pane-'+id).classList.add('on');
}

function tlog(el,msg,cls=''){
  const d=document.getElementById(el);
  const s=document.createElement('span');
  s.className='t-line '+(cls||'');
  s.textContent=msg;
  d.appendChild(s);
  d.scrollTop=d.scrollHeight;
}

const cmds={
  help:()=>{
    tlog('term','Available commands:','t-orange');
    ['help        — show this',
     'fetch       — fetch channel API',
     'fetchurl <id> — get player link with header',
     'channels    — list channels',
     'build <id>  — build custom player URL',
     'clear       — clear terminal',
     'version     — show version',
     'ping        — ping API endpoint'].forEach(c=>tlog('term','  '+c,'t-dim'));
  },
  fetch:async()=>{
    tlog('term',`[${ts()}] Fetching ${API}...`,'t-info');
    try{
      const r=await fetch(API);
      const d=await r.json();
      rawJSON=d;
      tlog('term',`[${ts()}] OK — ${d.length} channels loaded`,'t-ok');
      setStatus(d.length+' channels loaded');
    }catch(e){tlog('term','[ERR] '+e.message,'t-err')}
  },
  fetchurl:async(arg)=>{
    if(!arg){tlog('term','Usage: fetchurl <channel-id>','t-warn');return}
    if(!rawJSON){await cmds.fetch()}
    if(!rawJSON)return;

    const channel = rawJSON.find(c => c.id.toLowerCase() === arg.toLowerCase());
    if(channel){
        const fullUrl = `${PLAYER_BASE}?id=${encodeURIComponent(channel.id)}`;
        tlog('term','','');
        tlog('term','----------------------------------','t-dim');
        tlog('term',channel.name.toUpperCase(),'t-orange');
        tlog('term',fullUrl,'t-info');
        tlog('term','----------------------------------','t-dim');
        navigator.clipboard.writeText(fullUrl);
        setStatus('Link copied to clipboard');
    } else {
        tlog('term',`Channel ID "${arg}" not found.`,'t-err');
    }
  },
  channels:async()=>{
    if(!rawJSON){await cmds.fetch()}
    if(!rawJSON)return;
    tlog('term','ID           NAME','t-orange');
    rawJSON.forEach(c=>tlog('term',c.id.padEnd(12)+c.name,'t-dim'));
  },
  clear:()=>{document.getElementById('term').innerHTML=''},
  version:()=>{tlog('term','NY Cricket Live Dev Tools v1.1.0','t-orange');tlog('term','Build: 2026 · Format: Extended Player URL','t-dim')},
  ping:async()=>{
    tlog('term','Pinging API...','t-info');
    const t0=performance.now();
    try{await fetch(API);tlog('term','Pong! '+(performance.now()-t0).toFixed(0)+'ms','t-ok')}
    catch(e){tlog('term','Failed: '+e.message,'t-err')}
  }
};

function buildCMD(arg){
  if(!arg){tlog('term','Usage: build <channel-id>','t-warn');return}
  const url=`player.html?id=${encodeURIComponent(arg)}`;
  tlog('term','Player URL:','t-orange');
  tlog('term',window.location.origin+'/'+url,'t-val');
}

document.getElementById('termIn').addEventListener('keydown',async e=>{
  if(e.key!=='Enter')return;
  const v=e.target.value.trim();
  e.target.value='';
  if(!v)return;
  tlog('term','NY▸ '+v,'t-orange');
  const [cmd,...args]=v.split(' ');
  if(cmd==='build'){buildCMD(args[0]);return}
  if(cmd==='fetchurl'){await cmds.fetchurl(args[0]);return}
  if(cmds[cmd]){await cmds[cmd]();return}
  tlog('term','Unknown command: '+cmd+' (type help)','t-err');
});

tlog('term','NY Cricket Live Dev Tools','t-orange');
tlog('term','Type help to see commands','t-dim');

function buildURL(){
  const url=document.getElementById('s-url').value;
  const kid=document.getElementById('s-keyid').value;
  const key=document.getElementById('s-key').value;
  const ck=document.getElementById('s-cookie').value;
  tlog('stream-log','Building player URL...','t-info');
  if(!url){tlog('stream-log','[ERR] URL required','t-err');return}
  const p=new URLSearchParams({url,keyId:kid,key:key,cookie:ck});
  const out='player.html?'+p.toString();
  tlog('stream-log','player.html?url=...&keyId='+kid.slice(0,8)+'...','t-val');
  navigator.clipboard.writeText(out).then(()=>tlog('stream-log','[OK] Copied to clipboard!','t-ok')).catch(()=>tlog('stream-log','[WARN] Copy failed','t-warn'));
  setStatus('URL built & copied');
}

async function testStream(){
  const url=document.getElementById('s-url').value;
  if(!url){tlog('stream-log','[ERR] No URL set','t-err');return}
  tlog('stream-log','Testing stream URL reachability...','t-info');
  setStatus('Testing stream...');
  try{
    const r=await fetch(url,{method:'HEAD',mode:'no-cors'});
    tlog('stream-log','[OK] Server reachable (CORS policy may apply)','t-ok');
  }catch(e){tlog('stream-log','[ERR] '+e.message,'t-err')}
  setStatus('Stream test done');
}

async function fetchAPI(){
  tlog('stream-log','Fetching '+API,'t-info');
  try{
    const r=await fetch(API);
    const d=await r.json();
    rawJSON=d;
    tlog('stream-log','[OK] '+d.length+' channels. Auto-filling first channel...','t-ok');
    const c=d[0];
    document.getElementById('s-url').value=c.url||'';
    document.getElementById('s-keyid').value=c.keyId||'';
    document.getElementById('s-key').value=c.key||'';
    document.getElementById('s-cookie').value=c.cookie||'';
    setStatus('API fetched — '+d.length+' channels');
  }catch(e){tlog('stream-log','[ERR] '+e.message,'t-err')}
}

function clearStream(){
  document.getElementById('stream-log').innerHTML='';
  ['s-url','s-keyid','s-key','s-cookie'].forEach(id=>document.getElementById(id).value='');
}

async function loadChannels(){
  const tb=document.getElementById('ch-table');
  tb.innerHTML='<tr><th>ID</th><th>Name</th><th>DRM</th><th>Cookie</th><th>URL</th></tr><tr><td colspan="5" style="color:#555;text-align:center;padding:12px">Loading...</td></tr>';
  try{
    const r=await fetch(API);
    const d=await r.json();
    rawJSON=d;
    tb.innerHTML='<tr><th>ID</th><th>Name</th><th>DRM</th><th>Cookie</th><th>URL</th></tr>';
    d.forEach(c=>{
      const tr=document.createElement('tr');
      const hasDRM=!!(c.keyId&&c.key);
      const hasCK=!!(c.cookie);
      tr.innerHTML=`
        <td style="color:#f07020;font-size:10px">${c.id}</td>
        <td style="color:#d4d4d4;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name}</td>
        <td><span class="badge ${hasDRM?'b-ok':'b-err'}">${hasDRM?'YES':'NO'}</span></td>
        <td><span class="badge ${hasCK?'b-ok':'b-warn'}">${hasCK?'SET':'MISSING'}</span></td>
        <td><button class="copy-btn" onclick="copyURL('${c.id}')">LINK</button></td>
      `;
      tb.appendChild(tr);
    });
    setStatus(d.length+' channels loaded');
  }catch(e){
    tb.innerHTML='<tr><td colspan="5" style="color:#f85149;text-align:center;padding:12px">Error: '+e.message+'</td></tr>';
  }
}

function copyURL(id){
  const url=PLAYER_BASE+'?id='+encodeURIComponent(id);
  navigator.clipboard.writeText(url).catch(()=>{});
  setStatus('Copied: '+url);
}

function syntaxHL(json){
  return JSON.stringify(json,null,2)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"([^"]+)":/g,'<span class="j-key">"$1"</span>:')
    .replace(/: "([^"]*)"/g,': <span class="j-str">"$1"</span>')
    .replace(/: (\d+\.?\d*)/g,': <span class="j-num">$1</span>')
    .replace(/: (true|false)/g,': <span class="j-bool">$1</span>')
    .replace(/: null/g,': <span class="j-null">null</span>');
}

async function loadJSON(){
  const url=document.getElementById('json-url').value;
  const area=document.getElementById('json-area');
  area.innerHTML='<span style="color:#555">Fetching...</span>';
  setStatus('Fetching JSON...');
  try{
    const r=await fetch(url);
    const d=await r.json();
    rawJSON=d;
    area.innerHTML='<pre style="white-space:pre-wrap;word-break:break-all">'+syntaxHL(d)+'</pre>';
    setStatus('JSON loaded — '+JSON.stringify(d).length+' bytes');
  }catch(e){
    area.innerHTML='<span class="t-err">Error: '+e.message+'</span>';
    setStatus('JSON fetch failed');
  }
}

function copyJSON(){
  if(!rawJSON){setStatus('Nothing to copy — load first');return}
  navigator.clipboard.writeText(JSON.stringify(rawJSON,null,2)).then(()=>setStatus('JSON copied!')).catch(()=>setStatus('Copy failed'));
}

setInterval(()=>{document.getElementById('stat-time').textContent=ts()},1000);
</script>
</body>
</html>
